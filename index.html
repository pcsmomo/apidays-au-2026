:root {

  --ev-c-bg: #dcf2eb; --ev-c-fg: #0a574a; --ev-c-edge: #a6d9ca;
  --ev-e-bg: #fbeed4; --ev-e-fg: #714305; --ev-e-edge: #ebcb8c;

}

    --line: #252c39; --line-strong: #3a4352; --band: #1c222d;
    --accent: #7f9cff; --accent-ink: #0e1219; --now: #ff6b55; --scrim: rgba(0, 0, 0, 0.6);
    --ev-a-bg: #1a2545; --ev-a-fg: #c0d0ff; --ev-a-edge: #2d3d6b;
    --ev-c-bg: #11312b; --ev-c-fg: #94e2d0; --ev-c-edge: #1f4d43;
    --ev-e-bg: #352910; --ev-e-fg: #f1cb80; --ev-e-edge: #57431b;
    --ev-s-bg: #2b1c37; --ev-s-fg: #dfbcf2; --ev-s-edge: #483159;
    --ev-g-bg: #3a142e; --ev-g-fg: #f7aed6; --ev-g-edge: #5e2249;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1219; --surface: #161b24; --ink: #e5e9f0; --muted: #98a3b5;
  --line: #252c39; --line-strong: #3a4352; --band: #1c222d;
  --accent: #7f9cff; --accent-ink: #0e1219; --now: #ff6b55; --scrim: rgba(0, 0, 0, 0.6);
  --ev-a-bg: #1a2545; --ev-a-fg: #c0d0ff; --ev-a-edge: #2d3d6b;
  --ev-c-bg: #11312b; --ev-c-fg: #94e2d0; --ev-c-edge: #1f4d43;
  --ev-e-bg: #352910; --ev-e-fg: #f1cb80; --ev-e-edge: #57431b;
  --ev-s-bg: #2b1c37; --ev-s-fg: #dfbcf2; --ev-s-edge: #483159;
  --ev-g-bg: #3a142e; --ev-g-fg: #f7aed6; --ev-g-edge: #5e2249;
  color-scheme: dark;
}
@media (max-width: 640px) {
  :root { --tc: 46px; --colmin: 158px; }
}

html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
button, input { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- header ---------- */
.top {
  flex: none;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-block: 16px 12px;
}
.eyebrow {
  margin: 0;
  font-family: var(--f-mono);
  font-size: 11.5px;
  letter-spacing: 0.04em;
  color: var(--muted);
}
h1 {
  margin: 2px 0 0;
  font-family: var(--f-display);
  font-weight: 800;
  font-stretch: 118%;
  font-size: clamp(22px, 3.2vw, 30px);
  line-height: 1.05;
  letter-spacing: -0.01em;
  text-wrap: balance;
}
h1 small {
  font-weight: 500;
  font-stretch: 100%;
  font-size: 0.55em;
  color: var(--muted);
  letter-spacing: 0;
  margin-left: 6px;
}
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.tabs {
  display: inline-flex;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 3px;
  gap: 2px;
}
.tabs button {
  border: 0;
  background: none;
  border-radius: 6px;
  padding: 6px 12px;
  cursor: pointer;
  font-weight: 650;
  font-stretch: 95%;
  white-space: nowrap;
}
.tabs button span { font-weight: 450; color: var(--muted); margin-left: 4px; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.tabs button[aria-selected="true"] span { color: inherit; opacity: 0.75; }
.search {
  flex: 1 1 220px;
  min-width: 0;
  max-width: 360px;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 9px;
  padding: 8px 12px;
}
.search::placeholder { color: var(--muted); }
.pickbtn {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 9px;
  padding: 7px 12px;
  cursor: pointer;
  font-weight: 650;
  font-stretch: 95%;
  white-space: nowrap;
}
.pickbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pickbtn .n {
  font-family: var(--f-mono);
  font-weight: 500;
  font-size: 12px;
  margin-left: 4px;
  opacity: 0.8;
}
.note {
  margin: 0;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.4;
}

/* ---------- grid ---------- */
.scroller {
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
  background: var(--surface);
  border: 1px solid var(--line);
  border-bottom: 0;
  border-radius: 10px 10px 0 0;
  overscroll-behavior: contain;
}
.grid {
  display: grid;
  position: relative;
  width: 100%;
  font-variant-numeric: tabular-nums;
}
.corner, .rh {
  position: sticky;
  top: 0;
  grid-row: 1;
  background: var(--surface);
  border-bottom: 1px solid var(--line-strong);
}
.corner {
  left: 0;
  z-index: 7;
  grid-column: 1;
  display: flex;
  align-items: flex-end;
  justify-content: flex-end;
  padding: 0 6px 8px;
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.06em;
  color: var(--muted);
  border-right: 1px solid var(--line);
}
.rh {
  z-index: 6;
  padding: 9px 10px 8px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-width: 0;
  border-left: 1px solid var(--line);
}
.rh b {
  font-family: var(--f-display);
  font-weight: 750;
  font-stretch: 108%;
  font-size: 15px;
  letter-spacing: -0.005em;
}
.chip {
  align-self: flex-start;
  font-size: 11px;
  font-weight: 600;
  line-height: 1;
  padding: 4px 7px;
  border-radius: 999px;
  background: var(--ev-bg);
  color: var(--ev-fg);
  border: 1px solid var(--ev-edge);
  white-space: nowrap;
}
[data-ev="a"] { --ev-bg: var(--ev-a-bg); --ev-fg: var(--ev-a-fg); --ev-edge: var(--ev-a-edge); }
[data-ev="c"] { --ev-bg: var(--ev-c-bg); --ev-fg: var(--ev-c-fg); --ev-edge: var(--ev-c-edge); }
[data-ev="e"] { --ev-bg: var(--ev-e-bg); --ev-fg: var(--ev-e-fg); --ev-edge: var(--ev-e-edge); }
[data-ev="s"] { --ev-bg: var(--ev-s-bg); --ev-fg: var(--ev-s-fg); --ev-edge: var(--ev-s-edge); }
[data-ev="g"] { --ev-bg: var(--ev-g-bg); --ev-fg: var(--ev-g-fg); --ev-edge: var(--ev-g-edge); }

.tm {
  grid-column: 1;
  position: sticky;
  left: 0;
  z-index: 4;
  background: var(--surface);
  border-right: 1px solid var(--line);
  font-family: var(--f-mono);
  font-size: 11px;
  color: var(--muted);
  text-align: right;
  padding: 3px 6px 0 0;
  line-height: 1;
}
.tm.q { font-size: 9.5px; opacity: 0.7; }
.tm.h { color: var(--ink); font-weight: 600; }
.hl { grid-column: 2 / -1; border-top: 1px dashed var(--line); z-index: 0; pointer-events: none; }
.hl.h { border-top: 1px solid var(--line-strong); }
.hl.half { border-top-style: solid; }
.vc { grid-row: 2 / -1; border-left: 1px solid var(--line); z-index: 0; pointer-events: none; }

.band {
  grid-column: 2 / -1;
  z-index: 1;
  background: repeating-linear-gradient(135deg, var(--band) 0 6px, transparent 6px 12px);
  display: flex;
  align-items: center;
  min-width: 0;
}
.band span {
  position: sticky;
  left: calc(var(--tc) + 8px);
  margin-left: 8px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 3px 8px;
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
}
.band span i { font-style: normal; font-family: var(--f-mono); font-weight: 500; letter-spacing: 0; margin-left: 6px; }
.band.end { background: none; border-top: 2px solid var(--line-strong); align-items: flex-start; padding-top: 6px; }

.s {
  z-index: 2;
  position: relative;
  justify-self: start;
  width: calc(100% / var(--lanes, 1) - 6px);
  margin: 2px 0 2px calc(100% / var(--lanes, 1) * var(--lane, 0) + 3px);
  min-width: 0;
  overflow: hidden;
  border-radius: 7px;
  background: var(--ev-bg);
  color: var(--ev-fg);
  border: 1px solid var(--ev-edge);
  padding: 5px 7px 6px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  cursor: pointer;
  transition: opacity 0.15s, filter 0.15s;
}
.s:hover { border-color: var(--ev-fg); }
.s:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
.s.picked { border-color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
.s.dim { opacity: 0.25; filter: saturate(0.2); }
.s .meta {
  display: flex;
  gap: 6px;
  align-items: baseline;
  font-family: var(--f-mono);
  font-size: 10.5px;
  line-height: 13px;
  margin-right: 18px;
  white-space: nowrap;
  overflow: hidden;
  opacity: 0.85;
}
.s .badge {
  font-family: var(--f-body);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.s .ttl {
  font-weight: 650;
  font-stretch: 90%;
  font-size: 13px;
  line-height: 16px;
  color: var(--ink);
  display: -webkit-box;
  -webkit-box-orient: vertical;
  overflow: hidden;
  overflow-wrap: anywhere;
}
.s .ttl.tba { color: var(--muted); font-style: italic; font-weight: 500; }
.s .spk {
  font-size: 11.5px;
  line-height: 15px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.s .trk {
  margin-top: auto;
  font-size: 9.5px;
  line-height: 13px;
  font-weight: 700;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  opacity: 0.8;
}
.s.mini { padding: 0 7px; justify-content: center; }
.s.mini .ttl { -webkit-line-clamp: 1; font-size: 12px; line-height: 14px; }
.s.mini .ttl b { font-family: var(--f-mono); font-weight: 500; font-size: 10.5px; color: var(--ev-fg); margin-right: 6px; }
.star {
  position: absolute;
  top: 1px;
  right: 1px;
  width: 24px;
  height: 22px;
  border: 0;
  background: none;
  padding: 0;
  cursor: pointer;
  font-size: 14px;
  line-height: 22px;
  color: var(--ev-fg);
  opacity: 0.55;
}
.star:hover { opacity: 1; }
.s.picked .star { color: var(--accent); opacity: 1; }

.now {
  grid-column: 1 / -1;
  align-self: start;
  z-index: 5;
  height: 0;
  border-top: 2px solid var(--now);
  pointer-events: none;
}
.now span {
  position: sticky;
  left: 0;
  display: inline-block;
  transform: translateY(-60%);
  background: var(--now);
  color: #ffffff;
  font-family: var(--f-mono);
  font-size: 10.5px;
  font-weight: 600;
  padding: 2px 5px;
  border-radius: 4px;
}

/* ---------- dialog ---------- */
dialog {
  width: min(580px, calc(100% - 32px));
  max-height: min(85vh, 760px);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 0;
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
}
dialog::backdrop { background: var(--scrim); }
.dlg-in { padding: 20px 22px 18px; display: flex; flex-direction: column; gap: 14px; }
.d-meta { font-family: var(--f-mono); font-size: 12px; color: var(--muted); line-height: 1.5; }
dialog h2 {
  margin: 0;
  font-family: var(--f-display);
  font-weight: 750;
  font-stretch: 100%;
  font-size: 21px;
  line-height: 1.2;
  text-wrap: balance;
}
.d-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.d-chips .chip.plain { --ev-bg: transparent; --ev-fg: var(--muted); --ev-edge: var(--line); }
.d-spk { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.d-spk li { display: flex; flex-direction: column; gap: 1px; }
.d-spk b { font-weight: 650; }
.d-spk span { font-size: 13px; color: var(--muted); }
.d-desc { font-size: 14.5px; line-height: 1.55; max-width: 65ch; }
.d-desc p { margin: 0 0 10px; white-space: pre-line; }
.d-desc p:last-child { margin-bottom: 0; }
.d-desc.empty { color: var(--muted); font-style: italic; }
.d-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 14px; }
.d-actions button {
  border: 1px solid var(--line);
  background: var(--bg);
  border-radius: 9px;
  padding: 8px 14px;
  cursor: pointer;
  font-weight: 650;
}
.d-actions button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

@media (prefers-reduced-motion: reduce) {
  .s { transition: none; }
}
</style>
</head>

<script type="application/json" id="data">[{"id":4143,"day":"2026-10-28","start":"08:15","end":"09:15","room":"Room 107","title":"Women in API Breakfast","type":"conference","event":["API Economy Summit"],"track":[],"speakers":[],"desc":""},{"id":4152,"day":"2026-10-28","start":"09:00","end":"09:15","room":"","title":"Welcome Breakfast","type":"break","event":["Apidays","The Executive AI Security Forum"],"track":[],"speakers":[],"desc":""},{"id":4215,"day":"2026-10-28","start":"09:15","end":"10:00","room":"Room 112","title":"Session 1: The EU AI Act","type":"talk","event":["The Executive AI Security Forum"],"track":["The Executive AI Security Forum"],"speakers":[{"n":"Chuck Herrin","c":"Herrin Advisory","j":"Founder and Principal Consultant"}],"desc":""},{"id":4153,"day":"2026-10-28","start":"09:20","end":"09:25","room":"Room 109 + 110","title":"Opening Remarks","type":"opening_remarks","event":["Apidays"],"track":[],"speakers":[{"n":"Mehdi Medjaoui","c":"Founder and Chairman of Apidays Conferences","j":"Author of Continuous API Management"}],"desc":""},{"id":4179,"day":"2026-10-28","start":"09:25","end":"09:45","room":"Room 109 + 110","title":"AIOps at CBA: When Every Minute Matters","type":"keynote","event":["Apidays"],"track":["keynote"],"speakers":[{"n":"Richa Nagpal (Rinki)","c":"CommBank","j":"Head of Engineering, Payments"}],"desc":"This is our journey of how we built an agentic system to enable automatic incident resolution reducing MTTR significantly. In this talk we will share learnings and strategies on how we solved this at scale and creating a common framework for future adoption."},{"id":4066,"day":"2026-10-28","start":"09:45","end":"10:05","room":"Room 109 + 110","title":"Monetizing Partner Ecosystems via APIs","type":"keynote","event":["Apidays"],"track":["keynote"],"speakers":[{"n":"Harish Kelath","c":"HCLTech","j":"Director, Digital Business Alliances - APJ"}],"desc":"APIs have evolved from technical integration tools into the foundational building blocks for Go-To-Market strategies and Global Systems Integrator ecosystems. This proposal focuses on how to build, govern, and monetize API partnerships across diverse markets to drive measurable return on investment. The audience will learn how to align API architecture with revenue goals, structure scalable co-sell motions, and track ecosystem success metrics beyond basic API call volumes."},{"id":4057,"day":"2026-10-28","start":"10:00","end":"10:30","room":"","title":"Coffee Break / Networking / Expo","type":"break","event":["Apidays","Cloud Native Summit","The Executive AI Security Forum"],"track":[],"speakers":[],"desc":""},{"id":4216,"day":"2026-10-28","start":"10:15","end":"11:00","room":"Room 112","title":"Session 2: America's AI Policy Conundrum","type":"talk","event":["The Executive AI Security Forum"],"track":["The Executive AI Security Forum"],"speakers":[{"n":"Chuck Herrin","c":"Herrin Advisory","j":"Founder and Principal Consultant"}],"desc":""},{"id":4259,"day":"2026-10-28","start":"10:30","end":"10:55","room":"Room 106","title":"Who's Accountable When the Agent Gets It Wrong? Governance, risk and the accountability gap in the agentic enterprise","type":"keynote","event":["Cloud Native Summit"],"track":[],"speakers":[{"n":"BMK Lakshminarayanan","c":"SECTION6","j":"Transformation Architect"}],"desc":"You can’t govern autonomous systems simply by piling on approval gates. What happens when an AI agent makes decisions and takes action faster than your organisation can review them—and who owns the consequences when it gets something wrong? This session explores AI agents through a governance, risk and compliance (GRC) lens. We’ll examine how to design accountability into agentic systems from the outset: clear ownership, defined operating boundaries, traceable decisions, and tamper-evident audit trails. The goal is not merely to record what happened, but to establish who authorised the action, whether it stayed within its mandate, and who is responsible for responding when it did not. The central question: how do we enable autonomous action without creating an accountability gap?"},{"id":4220,"day":"2026-10-28","start":"10:30","end":"10:55","room":"Room 103","title":"Don't Waste Your Backpressure: Engineering Better AI Harnesses as a Team","type":"talk","event":["Apidays"],"track":["Enterprise API & AI Deployments"],"speakers":[{"n":"Dasith Wijesiriwardena","c":"Microsoft","j":"Principal Software Engineer"}],"desc":"An AI coding agent can produce a convincing change and still leave your\nteam explaining the same conventions, checking the same things, and catching\nthe same mistakes. One engineer adds a prompt, another adds a rule, and the\nnext session starts the argument again. Everyone has a favourite setup.\nThe team still has the same problem. We are giving agents plenty of\nfeedback, but how much of it helps anyone beyond the person typing it?\n\nFrom a forward-deployed engineer's perspective, I'll explore how teams can\nbuild and improve a shared engineering harness: the tools, context, and\ncontrols around their coding agents. We'll look at how to manufacture useful\nbackpressure so agents can correct their work before it reaches a human,\nthen use telemetry to find where that feedback is helping and where it is\ncreating expensive friction. I'll show how to refine noisy sensors, move\nrepeatable checks from model judgment into tools, and reduce token waste\nwithout quietly handing more work back to reviewers. You'll leave with a\npractical improvement cycle for your team: find a recurring failure, improve\nthe harness, measure the result, and share what works. The goal isn't more\nrules. It's to stop paying for the same lesson twice."},{"id":4322,"day":"2026-10-28","start":"10:30","end":"11:20","room":"Room 101 + 102","title":"Hack the Chatbot: Prompts, Promos and Protection","type":"workshop","event":["Apidays"],"track":["Workshops"],"speakers":[{"n":"Susum Tang","c":"Datadog","j":"Solutions Engineer"}],"desc":"AI chatbots are now the front door to your APIs, and they can be tricked. In this 50-minute hands-on workshop, you’ll use your own phone to try to talk “Mel”, a Melbourne online store’s shopping assistant, into handing over a discount code it was told to keep secret. Round by round, the defences get stronger. You’ll see why fixed rules can’t stop prompt injection and jailbreaks, why AI guardrails alone still leave gaps, and why API and application security matter inside the app, not just at the edge. Then we’ll switch hats and investigate what happened end to end, following a single request from the browser through the APIs to the AI agent’s decisions. No security or AI background needed. Just bring your phone."},{"id":4144,"day":"2026-10-28","start":"10:30","end":"11:20","room":"Room 107","title":"Making use of the Kin Score in the Australian/ANZ region","type":"facilitated_roundtable","event":["API Economy Summit"],"track":[],"speakers":[{"n":"Kin Lane","c":"API Evangelist","j":"Founder"}],"desc":"Building an API product is only part of the story. Getting it discovered, adopted and generating commercial value takes more than good technology.\n\nWith AI reshaping how organisations find and use digital services, and regulation changing how they share data, what does it take to turn API ambitions into business results? This API Economy Roundtable brings together commercial, digital and technical practitioners to explore these questions through practical examples and facilitated conversations.\n\nThis session is a hands-on exploration of what an independent, agent-generated assessment of external-facing APIs can tell us about agentic discoverability, usability, and AI-readiness.\n\nIn conversation with Kin Lane, API Evangelist, we will dig into the he Kin Score and its importance in the region.\n\nThe Kin Score is a 0–100 composite of governance fundamentals across six base facets: contracts, documentation, security, support, operations and discoverability, with: a regulatory layer for banking, health, payments, insurance, securities, energy, education, government and telecom; and an open source layer where the product is itself a public repository.\n\nWe'll explore using Kin Score analysis and insights to assess potential partners, benchmark different API offerings, and strengthen the case for investment in API/MCP roadmaps.\n\nThe conversation will be facilitated by Claire Barrett and Shaugh McIntosh."},{"id":4168,"day":"2026-10-28","start":"10:30","end":"11:20","room":"Room 105","title":"We taught AI Agents to cheat - we didn't realise how good they'd be at finding all the gaps we left open","type":"workshop","event":["Apidays"],"track":["Workshops"],"speakers":[{"n":"Claudio Tag","c":"IBM APAC","j":"CTO Automation"}],"desc":"Recent security incidents have exposed a dangerous pattern: AI agents complete their objectives by circumventing the very controls designed to contain them. We built agents to be resourceful, persistent and goal-driven. It turns out they're very good at it — even when the path to reach the goal isn't what we had envisaged.\n\nIn regulated industries, this isn't an edge case. An agent that finds a gap doesn't just create a security incident. It creates a compliance failure, an audit nightmare and a trust crisis — simultaneously.\n\nRegulated organisations require more than hopeful prompting and application-layer rules. Every agent must carry a verified, lifecycle-governed identity — and policy enforcement points must act as circuit breakers between autonomous agents, their brains, and the systems they touch.\nAI Safety demands distributed, layered Kill Switches.\n\nThe most important feature of any AI agent today isn't what it can do. It's whether you can stop it in time."},{"id":4203,"day":"2026-10-28","start":"10:30","end":"11:20","room":"Room 104","title":"Risk-Proof Your AI: The New API Governance Playbook","type":"workshop","event":["Apidays"],"track":["Workshops"],"speakers":[{"n":"Markus Müller","c":"Boomi","j":"Global CTO - API Management"}],"desc":"Agentic AI is revolutionizing industries—but with greater agentic autonomy comes greater risk. Strong API governance provides the unified controls needed to keep AI agents secure, compliant, and scalable, ensuring they deliver business value safely.\n\nBuilding on the strategies from “Govern APIs to Turn AI Ambitions into Production Reality,” this session will show you how to architect for federation, enforce governance, and securely leverage agentic protocols like MCP. You’ll see real-world examples from manufacturing, healthcare, transportation & logistics, and financial services—where Boomi API Management powers secure, agentic AI at scale.\n\nIn this workshop, guided by Markus Müller, Global Field CTO, API Management at Boomi, you’ll learn how to:\n\nDesign, expose and curate APIs as trusted tools for AI agents using protocols like MCP\nApply governance and security controls to ensure your APIs and agents are enterprise-ready\nMeasure and optimize your APIs and agents for business impact and ROI\n\nWalk away with a proven playbook—ready to protect your business, fuel API growth, and lead confidently in the age of agentic AI."},{"id":4221,"day":"2026-10-28","start":"10:55","end":"11:20","room":"Room 103","title":"The Enterprise Knowledge Graph","type":"talk","event":["Apidays"],"track":["Enterprise API & AI Deployments"],"speakers":[{"n":"Anikesh Sasmal","c":"Wipro","j":"Senior Solution Architect - Managing Consultant"}],"desc":"Every network operator wants autonomous operations. Most are wiring AI agents directly to dozens of element-manager, telemetry and ticketing APIs. They are discovering that agents fail not for lack of intelligence, but for lack of meaning. An alarm, a rectifier, a service polygon, a speed-test result and a work order can all describe one event, yet no API knows it.\n\nThis talk argues that the path to Autonomous Network Operations (ANO) runs through an ontology, not another integration layer. I'll draw on architecture work in a national-scale broadband network to show how an Enterprise Knowledge Graph (EKG) becomes the API contract between systems, humans and agents. OWL2 models define what things are. SHACL shapes enforce what \"good\" looks like. PROV-O records why a decision was made. Virtual graphs federate live sources without copying them.\n\nYou'll see three patterns in practice:\n\ncomposite diagnostic APIs that bundle atomic tests behind one governed threshold set\nsemantic APIs and MCP tools that let agents follow cause-and-effect chains (power fault → battery → access node → service impact) instead of guessing\na command-centre digital twin that moves teams from detection-after-impact to sense → understand → predict → simulate → act\n\nYou'll leave with three things:\n\na reference architecture\na maturity path from reactive to autonomous\nthe governance guardrails (versioned thresholds, provenance, human-on-the-loop) that make agent-driven operations safe enough to trust"},{"id":4285,"day":"2026-10-28","start":"11:00","end":"11:25","room":"Room 106","title":"Know Your Agents, Control Their Actions: Governing the Identity, Behavior, and Spend of Production AI","type":"talk","event":["Cloud Native Summit"],"track":[],"speakers":[{"n":"Derric Gilling","c":"WSO2","j":"VP and GM, API Platform BU"}],"desc":"An agent with the right credentials, talking to the right systems, can still do the wrong thing. In Australia, most organizations say agent deployment is already outpacing their ability to govern it, and roughly half have watched an agent take an incorrect action during a pilot. The gap isn't identity or access. It's everything between a valid credential and a completed action.\n\nProduction AI needs three things governed. Who the agent is: a first-class identity and audit trail, not a shared service account. What it does: scoped access, plus runtime guardrails that catch the jailbreak an authorized agent still shouldn't act on. And what it spends: cost attributed to each agent, not to an API key. Assembling those from three separate products gives you three policy languages, three consoles, and no answer to the question every incident review asks: what did this agent do, and why was it allowed to?\n\nA single enforcement point answers it. You'll leave with a concrete pattern to put in place before your next pilot becomes a production incident."},{"id":4217,"day":"2026-10-28","start":"11:00","end":"11:45","room":"Room 112","title":"Session 3: The Realities of AI-Powered Offense","type":"talk","event":["The Executive AI Security Forum"],"track":["The Executive AI Security Forum"],"speakers":[{"n":"Chuck Herrin","c":"Herrin Advisory","j":"Founder and Principal Consultant"}],"desc":""},{"id":4196,"day":"2026-10-28","start":"11:20","end":"11:45","room":"Room 103","title":"MCP Isn't Enough: Why Agents Needed an Event Loop, Not Just an API","type":"talk","event":["Apidays"],"track":["Enterprise API & AI Deployments"],"speakers":[{"n":"Saul Caganoff","c":"Deloitte Australia","j":"Managing Director"}],"desc":"Agentic workflows need more than MCP-wrapped APIs: they must respond when context changes. Using Boyd’s OODA loop, this talk shows why event-driven architecture is essential for AI processes."},{"id":4157,"day":"2026-10-28","start":"11:20","end":"12:10","room":"Room 105","title":"Legacy to Agent-ready tools in 5 mins: Apigee agent skills, MCP registry and MCP transcoding","type":"workshop","event":["Apidays"],"track":["Workshops"],"speakers":[{"n":"Joey Wong","c":"Google Cloud","j":"Customer Engineer"},{"n":"Ashish Kumar","c":"Google","j":"AuNZ Account Executive"}],"desc":"Turn legacy APIs into agent-ready tools in 5 minutes. Use Apigee agent skills, MCP registry, and live MCP transcoding to seamlessly connect enterprise services to AI agents without refactoring."},{"id":4289,"day":"2026-10-28","start":"11:20","end":"12:10","room":"Room 104","title":"Build, Connect and Control your Agents with WSO2 Agentic Enterprise Fabric","type":"workshop","event":["Apidays"],"track":["Workshops"],"speakers":[{"n":"Shazni Nazeer","c":"WSO2","j":"Director & Senior Enterprise Architect"}],"desc":"AI agents are moving beyond experimentation and becoming part of how enterprises build applications, automate processes, and interact with customers and systems. But deploying agents at scale introduces new challenges: How do you build agents efficiently? How do you securely connect them to enterprise data, APIs, applications, and other agents? And how do you maintain control, security, governance, and visibility as agentic systems grow?\n\nIn this hands-on workshop, explore how WSO2 Agentic Enterprise Fabric provides a unified foundation to Build, Connect, and Control enterprise AI agents. See how agents can be created and orchestrated, connected securely to enterprise capabilities, and governed with the security, identity, policies, and observability required for production use.\n\nThrough practical walkthrough and real-world scenarios, discover how enterprises can move from individual AI experiments to secure, connected, and governable agentic applications, while leveraging the APIs, integrations, and systems they already have."},{"id":4156,"day":"2026-10-28","start":"11:20","end":"12:10","room":"Room 101 + 102","title":"APIs as the Trust Layer: Building Accountable AI with Auth0","type":"workshop","event":["Apidays"],"track":["Workshops"],"speakers":[{"n":"Toby Allen","c":"Auth0","j":"Senior Solutions Engineer"}],"desc":"As AI moves from experiments to enforcement, Auth0's API-first identity platform brings accountability, FGA, machine identity & audit logs without slowing developer velocity."},{"id":4261,"day":"2026-10-28","start":"11:30","end":"11:55","room":"Room 106","title":"Logs, Metrics, Traces... and Models: The Evolution of Observability","type":"talk","event":["Cloud Native Summit"],"track":[],"speakers":[{"n":"Diana Omuoyo","c":"Splunk","j":""}],"desc":"AI systems have introduced new operational challenges: unpredictable model behaviour, data drift, prompt variability, escalating infrastructure costs, regulatory obligations, and growing concerns around data sovereignty and security.\n\nThis session explores how observability practices need to evolve for operating AI at scale. Drawing on real-world lessons from modern observability practices, we will examine the five critical pillars of AI observability: Infrastructure Health, Model Performance, Data Quality, Cost & Security.\n\nAttendees will learn how to build end-to-end visibility across the entire AI lifecycle. The presentation will demonstrate how telemetry, tracing, logging, and AI-specific signals can be combined to detect model degradation, identify security risks, validate compliance requirements, and provide actionable insights for platform and operations teams.\n\nWhether you are responsible for platform engineering, security operations, or AI infrastructure, this talk will provide a practical framework for implementing observability strategies that enable reliable, effecient and secure AI systems."},{"id":4145,"day":"2026-10-28","start":"11:30","end":"13:00","room":"Room 107","title":"The API Economy in an AI-everywhere world","type":"facilitated_roundtable","event":["API Economy Summit"],"track":[],"speakers":[{"n":"Erik Tveitnes","c":"REA Group","j":"API Lead"},{"n":"William Fettke","c":"Telstra","j":"Product Owner: APIs & Developer Ecosystem"}],"desc":"Building an API product is only part of the story. Getting it discovered, adopted and generating commercial value takes more than good technology.\n\nWith AI reshaping how organisations find and use digital services, and regulation changing how they share data, what does it take to turn API ambitions into business results?\n\nWhat happens after “build it and they will come”? How do API products reach customers through partnerships and evolving distribution channels? And are regulation, privacy and digital identity simply a growing cost of doing business—or an overlooked source of opportunity?\n\nLed by different, yet complementary, experiences at Telstra and REA Group, Will Fettke and Erik Tveitnes will share their case studies and lessons behind their organisations' strategic commitment, operating models and investment decisions that power API-enabled growth and partner ecosystems.\n\nRather than a series of presentations to sit back and watch, this session follows the popular format for all our API Economy conversations. You’ll get to hear from Will and Erik; while also exchanging experiences, testing ideas, and exploring practical questions with peers in small, facilitated groups.\n\nCome ready to contribute your challenges and lessons—and leave with fresh perspectives, useful connections and ideas to apply to your own organisation’s participation in the API economy.\n\nThe conversations will be facilitated by Claire Barrett and Shaugh McIntosh.\n\n[Speaker profiles]\n\nWill Fettke, Product Owner (APIs & Developer Ecosystem) at Telstra leads B2B2X APIs and Experience. He leads the team defining Telstra’s monetised API strategy and realising it through the development of API products and the customer portal they are exposed, managed and supported on dev.telstra.com.\n\nErik Tveitnes, API Lead at REA Group, has been at the forefront of API product strategy and build-out in Australia's property tech ecosystems for 9 years. He has overseen the development of API-powered digital products and API economy participation in the sector, bringing REA Group strategies to life through digital platform design and development."},{"id":4213,"day":"2026-10-28","start":"11:45","end":"12:10","room":"Room 103","title":"A Product Manager's Journey Prototyping with AI (Front and Back End)","type":"talk","event":["Apidays"],"track":["Enterprise API & AI Deployments"],"speakers":[{"n":"Peter Marelas","c":"New Relic","j":"Senior Product Management Director"}],"desc":"In three weeks, a product manager using Claude Code built a root cause analysis engine for distributed systems. It has a web front end, a web API and over 30,000 lines of code. This talk walks through each step, from research to a working prototype and the tricks applied along the way to speed up the process."},{"id":4218,"day":"2026-10-28","start":"11:45","end":"12:30","room":"Room 112","title":"Session 4: Beyond the Hype Cycle","type":"talk","event":["The Executive AI Security Forum"],"track":["The Executive AI Security Forum"],"speakers":[{"n":"Chuck Herrin","c":"Herrin Advisory","j":"Founder and Principal Consultant"}],"desc":""},{"id":4260,"day":"2026-10-28","start":"12:00","end":"12:25","room":"Room 106","title":"Conformance for Inference: How We Reduced Bad Deploys on a GPU Platform","type":"talk","event":["Cloud Native Summit"],"track":[],"speakers":[{"n":"Hrittik Roy","c":"vClustert","j":"Software Engineer | CNCF Ambassador"}],"desc":"Inference on GPUs fails in repetitive ways: wrong image or artifact, mismatched CUDA or runtime, undersized GPU memory, bad resource requests, or a model that passes offline checks but regresses under real traffic. On a shared k8s GPU platform, those mistakes become multi-tenant incidents - noisy neighbors, OOMKills, SLO breaches, and rollbacks that waste accelerator time.\n\nThis talk describes how one team built conformance for inference workloads, checks applied before production traffic, covering container and model artifacts, GPU capacity and visibility contracts, health and readiness semantics, and minimum observability (metrics/traces where used).\n\nAttendees leave with a practical checklist they can reuse: how to separate \"\"builds\"\" from \"\"serving\"\" conformance, how to catch regressions early, and how to align GPU scheduling and quotas with inference SLOs.\n\nWe will share what worked, what did not, what teams pushed back on, and a short checklist for platform and app owners."},{"id":4078,"day":"2026-10-28","start":"12:10","end":"12:35","room":"Room 103","title":"Why 93% of Enterprises Can’t Scale Agentic AI - and How the API Execution Layer Fixes It","type":"talk","event":["Apidays"],"track":["Enterprise API & AI Deployments"],"speakers":[{"n":"Asif Waquar","c":"Munich Re","j":"Solutions Architect"},{"n":"Khilitchandra Prajapati","c":"Power Tech Consulting","j":"Senior ICT Consultant"}],"desc":"Everyone’s talking about AI agents. Very few are talking about why most of them fail in production.\nHere’s what I have seen: organisations pour months into building clever agents, pick the right models, nail the orchestration - and then hit a wall the moment they try to go live. The agents can’t reliably talk to backend systems. There’s no governance over what they’re calling or how often. Observability is an afterthought. And when you’re operating across multiple countries with different data residency rules and regulatory expectations, it gets messy fast.\nThe missing piece isn’t the agent. It’s the API layer underneath it.\nThis session is a practical, architecture-driven walkthrough of what it actually takes to build an API execution layer that agentic systems can rely on. I’ll draw from my experience delivering technology across multiple markets where “just deploy it” is never as simple as it sounds.\n\nWhat I will Cover\nThe gap nobody’s fixing: Why most agentic AI pilots stall at scale - fragmented APIs, zero governance, no visibility into what agents are actually doing. The model isn’t the bottleneck. The plumbing is.\nMaking legacy systems agent-ready: How to expose existing REST APIs as MCP servers so agents can discover and consume them autonomously, without rewriting everything from scratch.\nGovernance that doesn’t slow you down: Token limits, content safety, PII detection, authentication for agent-to-API calls - all applied as policies at the gateway level. One control plane for traditional APIs, MCP tools, and agent APIs.\nMulti-region, multi-regulation reality: Data residency in Australia is not the same as in Singapore or the UAE. I will walk through how to design an API layer that respects regional rules without duplicating your entire architecture per market.\n\nKey Takeaways\nAttendees will walk away understanding why the API execution layer is the single biggest factor in whether agentic AI scales or stalls, how to make legacy systems agent-consumable without a full rewrite, what governance looks like when your API consumers are autonomous agents instead of developers, and a practical multi-region architecture pattern they can adapt to their own context."},{"id":4138,"day":"2026-10-28","start":"12:10","end":"12:35","room":"Room 105","title":"Let Your Api Talk","type":"talk","event":["Apidays"],"track":["Technical Deep Dives"],"speakers":[{"n":"Randi Ratnayake","c":"Arinco","j":"Architect | Consultant"}],"desc":"APIs are not just endpoints. They communicate intent, capability, and boundaries. When designed well, they are self descriptive, predictable, secure, and resilient under change. In this talk, I will cover the non negotiables of production grade APIs, from contract first design and clean resource modeling to versioning, error semantics, observability, and governance that enables scale without chaos.\n\nWhen structure is precise and constraints are explicit, your API does more than function. It becomes clear to both humans and machines. Clarity in inputs, consistency in behavior, and discipline in change management allow your API to speak for itself. Stop explaining your API. Design it so it can talk."},{"id":4195,"day":"2026-10-28","start":"12:10","end":"13:00","room":"Room 104","title":"From Adoption nightmares to Trusted Outcomes: How Federated AI Gateway Turns Agentic AI into Trusted Digital Workforce","type":"workshop","event":["Apidays"],"track":["Workshops"],"speakers":[{"n":"Peter Jessup","c":"IBM ANZ","j":"Integration and API specialist"},{"n":"Kok Sing\tKhong","c":"IBM ANZ","j":"Integration Architect"}],"desc":"Most organizations have spent years building APIs, integration layers, and governance frameworks. Yet many AI initiatives struggle to move beyond experimentation. Why? Because clean data alone does not create trustworthy, scalable AI.\n\nIn this hands-on workshop, explore how existing API and integration investments can become the operational foundation for deterministic AI agents. Learn how governance, security, policy enforcement, and real-time access to enterprise systems enable AI agents to act with confidence, consistency, and control.\n\nSee how IBM Interact Gateway helps organizations securely connect AI agents to enterprise applications, APIs, and business workflows, transforming years of integration investment into a trusted platform for scalable enterprise AI.\n\nWhat you'll learn\nWhy clean data is necessary but not sufficient for Enterprise AI\nHow APIs become the foundation for deterministic AI agents\nThe role of governance, security, and policy enforcement in agentic systems\nHow to operationalize existing integration investments for AI initiatives\nA demonstration of IBM Interact Gateway in action"},{"id":4158,"day":"2026-10-28","start":"12:10","end":"13:00","room":"Room 101 + 102","title":"API Security Hands On Attack Lab","type":"workshop","event":["Apidays"],"track":["Workshops"],"speakers":[{"n":"Peter Chai","c":"Akamai Technologies","j":"Principal Solutions Engineer - API Security"}],"desc":"Designed for tech pros and managers, this hands-on API Security Workshop explores real-world exploitation techniques, unintended data exposure risks, and strategies to defend your environment."},{"id":4263,"day":"2026-10-28","start":"12:30","end":"12:55","room":"Room 106","title":"Trusting Agents With Your Secrets: What OpenBao Taught Us About Agentic Identity","type":"talk","event":["Cloud Native Summit"],"track":[],"speakers":[{"n":"Rob Kenefeck","c":"Control Plane","j":""}],"desc":"Agentic systems need credentials. They need to authenticate to APIs, access databases, call external services, and do it autonomously, repeatedly, and at speed. The secrets management tooling most organisations rely on was designed for humans and static workloads. It was not designed for non-human identities that spin up, act, and disappear faster than any rotation policy was built to handle.\n\nAt ControlPlane, we started experimenting with OpenBao as a foundation for agentic identity management. Not because it was the obvious answer, but because we suspected the secrets management layer was the right place to solve this problem and wanted to find out if we were right.\n\nThis session shares what we found. Where the architecture held up, where it surprised us, where it fell short, and what we would do differently. We examine how OpenBao's dynamic secrets, policy engine, and audit capabilities map to the specific demands of autonomous agents, and where the gaps still are.\n\nThe honest version of this talk is not a blueprint. It is a practitioner's account of early experimental work in a space where most teams are either ignoring the problem or bolting on identity as an afterthought.\n\nIf you are building agentic systems and wondering how to handle credentials properly, this is the session that starts that conversation with real findings rather than vendor promises."},{"id":4219,"day":"2026-10-28","start":"12:30","end":"13:00","room":"Room 112","title":"C-Suite synthesis","type":"talk","event":["The Executive AI Security Forum"],"track":["The Executive AI Security Forum"],"speakers":[{"n":"Chuck Herrin","c":"Herrin Advisory","j":"Founder and Principal Consultant"}],"desc":""},{"id":4185,"day":"2026-10-28","start":"12:35","end":"13:00","room":"Room 105","title":"Turning Distributed Robotics into Composable APIs","type":"talk","event":["Apidays"],"track":[],"speakers":[{"n":"Frank Fan","c":"Amazon Web Services","j":"Solution Architect"},{"n":"Andy Gelme","c":"Silverpond","j":"A.I Platform Architect"}],"desc":"Robots are leaving the industrial environment. For decades they operated in managed industrial cells—fenced off, predictable, isolated from people. That era is ending: robots and autonomous agents are moving into warehouses, hospitals, homes, and public spaces where they work alongside humans. This shift raises the bar on two fronts at once—these systems must be genuinely useful, and they must be safe. Meeting both, in software that is distributed, concurrent, and runs across wildly different hardware, is one of the hardest problems in the field.\n\nModern robotics is really a fusion of fields—machine learning, media streaming, IoT, and robotics itself—each with its own tools, conventions, and hard edges. Yet under the surface they all want the same things: to compose components, pass messages, stay secure, deploy, and be observed in operation. Aiko Services provides that common ground—one coherent framework beneath the many domains, so you stop reconciling incompatible stacks and start building.\n\nIn this session, we demo a real-world use case: wrapping a physical device as an Aiko Actor and driving it safely over the network. You'll learn how to design portable, testable service APIs and leave with reusable assets—a hardware interface, a mock harness, and pipeline patterns—that give you a practical foothold on building safe, reliable, human-facing robotics."},{"id":4382,"day":"2026-10-28","start":"12:35","end":"13:00","room":"Room 103","title":"Best Experience Is Best Marketing: GTM for an Agent-First World.","type":"talk","event":["Apidays"],"track":["Enterprise API & AI Deployments"],"speakers":[{"n":"Pratham Kumar","c":"APILayer","j":"Developer Relations Manager"}],"desc":"For a decade, developer marketing ran on one core belief: get the API in front of a real engineer, let the docs and playground do the selling, and word of mouth handles the rest as developers hate to market. Every bottom-up GTM motion in this industry, self-serve pricing, generous free tiers, \"just try it\" onboarding, was built to win over a human who reads, tests, and champions.\n\nThat human is disappearing from the first stage of the funnel. Agents are now doing the initial evaluation: reading your docs, hitting your endpoints, comparing you against three competitors in the time it takes a person to open a pricing page. By the time a human sees your product, an agent has already formed an opinion and quietly ranked you against alternatives.\n\nYou don't sell to an agent the way you sell to a person. You don't need a pitch, a nurture sequence, or a demo call. Best experience is best marketing. If your API is the easiest for an agent to understand, integrate, and succeed with on the first try, it becomes the one that gets suggested, recommended, and chosen by default, no persuasion required.\n\nI have spent the last 6 years inside an API portfolio company watching this play out in real evaluation and pricing decisions, not as a hypothesis but as something showing up in how products actually get discovered and compared now.\n\nIn this talk I'll walk through what's already breaking in the classic developer GTM playbook, what \"documentation as marketing\" means when the reader is an LLM instead of a person, and where pricing and positioning strategy needs to change when your buyer's first impression is formed by a machine reading your API, not a human reading your landing page. Other than that, I'll also show my four dimensional framework that provides best experience to agents, and best experience means best GTM strategy in case of an agent especifically."},{"id":4058,"day":"2026-10-28","start":"13:00","end":"14:00","room":"","title":"Lunch Break / Networking / Expo","type":"break","event":["Apidays","Cloud Native Summit","The Executive AI Security Forum"],"track":[],"speakers":[],"desc":""},{"id":4191,"day":"2026-10-28","start":"14:00","end":"14:25","room":"Room 105","title":"The Agentic Shift: Rethinking API Management and Governance for the Agentic Era","type":"talk","event":["Apidays"],"track":["APIs for AI"],"speakers":[{"n":"David Carless","c":"Kong","j":"Vice President, Asia Pacific, India & Japan"}],"desc":"Legacy API and integration architectures are blocking enterprise AI agents from reaching production. This session breaks down why agentic AI demands event-driven, context-first connectivity–and how to build the infrastructure to support it. Learn practical patterns for hybrid MCP and API access, and walk away with a clear roadmap for moving AI initiatives from pilot to production to scale."},{"id":4201,"day":"2026-10-28","start":"14:00","end":"14:25","room":"Room 103","title":"Govern APIs to Accelerate AI ROI","type":"talk","event":["Apidays"],"track":["Architecture for Strategy"],"speakers":[{"n":"Markus Müller","c":"Boomi","j":"Global CTO - API Management"}],"desc":"As AI moves from experimentation to production, APIs have become the critical infrastructure agents depend on to access real-time data, interact with enterprise systems, and retrieve context. Without API governance, agents can introduce data leakage, policy violations, and operational instability, instead of driving business value.\n\nAt AI scale, managing APIs across distributed gateways without a centralized view makes it nearly impossible to catalog, control, and standardize what's been built. While Model Context Protocol simplifies how agents discover and invoke tools, it doesn’t secure the assets underneath, accelerating risk as quickly as it accelerates adoption.\n\nJoin Markus Müller, Global Field CTO, API Management at Boomi, to learn how an enterprise-grade platform enables teams to govern, monitor, productize, and safely expose their APIs as MCP-enabled, agentic tools.\n\nKey takeaways for Enterprise AI and API leaders:\n\nUncover the hidden costs of bypassing governance\nEnforce zero-trust principles and standardize API definitions to safely scale AI initiatives\nAlign speed with control to deliver measurable, sustainable ROI\n\nTransform every API into a trusted tool your agents can act on."},{"id":4264,"day":"2026-10-28","start":"14:00","end":"14:25","room":"Room 106","title":"The Best Agent No One Uses - Why enterprise AI adoption fails upstream of your code","type":"talk","event":["Cloud Native Summit"],"track":[],"speakers":[{"n":"Emma Tordsson","c":"Workday","j":"Principal Enterprise Architect | AI Strategy | Cloud-Native SaaS | Ethical AI Adoption"}],"desc":"You've just shipped a beautifully architected AI Agent. You've scoped the tools, got clean evals, solid traces... yet adoption flatlines. The issue is rarely in your code; it's in the disconnect in how enterprises govern AI, or the complete lack of it. We typically see three layers of AI governance, all required to be connected and cohesive but rarely are: the agent's runtime authority, the build supply chain (your assistants, models, and agentic tooling), and the accountability surface the user actually sees. In this talk we will look at all three layers, show where they fail to connect, and give concrete actions that can be implemented to make sure what you build is adoptable, not just shipped."},{"id":4064,"day":"2026-10-28","start":"14:00","end":"14:25","room":"Room 104","title":"Enterprise Agent Harness: MCP, Tokenomics, and Gateway Control","type":"talk","event":["Apidays"],"track":["The Agentic Enterprise"],"speakers":[{"n":"Madhan Sadasivam","c":"Google","j":"Solutions Architect"}],"desc":"Scale agent harnesses to production. Use AI Gateways to tame token costs, govern MCP tool discovery, and enforce authorization, turning unpredictable LLMs into secure, cost-managed enterprise assets."},{"id":4063,"day":"2026-10-28","start":"14:00","end":"14:25","room":"Room 101 + 102","title":"The Micro-SaaS Playbook: Turning Public APIs into Revenue Opportunities","type":"talk","event":["Apidays"],"track":["Digital strategy"],"speakers":[{"n":"Richard Owens","c":"Vanillah","j":"Director"}],"desc":"Every major SaaS platform has gaps — features their users need but that never make the roadmap. For builders who know where to look, these gaps are revenue opportunities hiding in plain sight.\nIn this lightning talk, I'll share the playbook I've developed for identifying underserved needs in SaaS ecosystems, building lightweight integrations using public APIs, and distributing them through platform marketplaces — where your target customers are already searching for solutions.\nBut here's what most people miss: the product revenue is often just the beginning. For service providers, marketplace integrations act as a trojan horse — they establish your authority in the ecosystem and open the door to services engagements worth multiples of the subscription fees. In my case, a single integration led to over $600,000 in services revenue from one client — before I'd spent a dollar on marketing.\nDrawing from my experience building business verification integrations across HubSpot and Xero — connecting Australian and New Zealand government registries to commercial platforms — I'll walk through a repeatable framework any developer or small team can apply to turn API documentation into revenue."},{"id":4265,"day":"2026-10-28","start":"14:30","end":"14:55","room":"Room 106","title":"\"On Behalf of Whom?\" How to Safely Propagate Identity in Multi-Agent Workflows","type":"talk","event":["Cloud Native Summit"],"track":[],"speakers":[{"n":"Jeff\tIshar","c":"Auth0","j":"Solutions Architect"}],"desc":"Say you're asking a chatbot AI to address a billing issue with your account. That AI does its thing by starting three other microservices in the background to retrieve your information, query your records and update the system for you. But as the frameworks behind these Agent-to-Agent (A2A) workflows are gaining adoption (via open-source protocols like the A2A protocol), it raises one of the biggest security questions imaginable: how can your backend systems trust which user approved an AI agent to perform that work?\n\nIn the process of one agent kicking off another agent, all context about the human user gets deleted in the first jump — it gets translated into a \"\"machine key\"\" by the first AI agent.\n\nThe result is the nightmare scenarios of systems being exposed to accidental information leaks or unauthorized use. This talk cuts through code to describe a common, working example of how we can safely pass a \"\"security baton\"\" from a person to an agent and back, even to another agent."},{"id":4197,"day":"2026-10-28","start":"14:30","end":"14:55","room":"Room 105","title":"Why securing models without securing APIs creates a false sense of control","type":"talk","event":["Apidays"],"track":["APIs for AI"],"speakers":[{"n":"Dominic Lovell","c":"Akamai","j":"Head of Solutions Engineering, ANZ"}],"desc":"In this session we challenge traditional AI security thinking and explore why API security is the true control plane behind AI. Learn how AI amplifies API gaps and how leaders can mitigate risk."},{"id":4065,"day":"2026-10-28","start":"14:30","end":"14:55","room":"Room 104","title":"Prompt to Production: Securing APIs in AI-Driven Systems","type":"talk","event":["Apidays"],"track":["The Agentic Enterprise"],"speakers":[{"n":"Peter Adeosun","c":"Wesfarmers","j":"Security Engineer and Platform"}],"desc":"As organisations rapidly adopt AI-driven systems, the journey from prompt experimentation to production-grade deployment introduces a new class of security, compliance, and architectural challenges. This session explores how to design and secure APIs that power modern AI use cases, especially those built on agent-based architectures, whether single-agent or multi-agent systems.\n\nUsing a real-world lens, we will break down the critical data and compliance requirements that underpin AI workloads, including sensitive data handling, audibility, and regulatory alignment. We will examine how these requirements influence architectural decisions such as agent orchestration, tool exposure, and trust boundaries.\n\nThe talk introduces a practical framework for securing AI-enabled APIs across key domains:\n\nIdentity & Access Management – Establishing strong identity models for both human users and autonomous agents, including authentication, authorisation, and fine-grained policy enforcement.\nAPI Gateway Strategy – Designing secure API gateways to expose AI tools and resources, enforce rate limiting, validate inputs/outputs, and provide centralised governance.\nHuman-in-the-Loop Controls – Integrating approval workflows and oversight mechanisms to mitigate risk in high-impact or sensitive operations.\nSecure Tool Exposure & MCP Security – Safely exposing internal systems and external integrations to AI agents using standards like MCP, enabling controlled, least-privilege access and ensuring secure, auditable interactions between models, tools, and data sources."},{"id":4198,"day":"2026-10-28","start":"14:30","end":"14:55","room":"Room 101 + 102","title":"Komatu's vision: The Enterprise AI Factory that Builds at scale Build, Deploy, Govern, Secure - Agents, Models, Tools","type":"talk","event":["Apidays"],"track":["Digital strategy"],"speakers":[{"n":"Shikha Agarwal","c":"IBM ANZ","j":"Integration Techsales Director"},{"n":"Matthew Baker","c":"Komatsu","j":"Head of Enterprise Applications & Automation"}],"desc":"AI is rapidly evolving from standalone assistants to ecosystems of agents, models, tools, and intelligent services. As enterprises embrace this new era, a critical question emerges: how do we govern, secure, and scale AI across the organization?\nThis session explores the rise of the Agent LifeCycle Governance as the foundation of a sustainable AI strategy. From AI service discovery and cataloguing to agent identity, trust, and policy enforcement, the Agent LifeCycle Governance provides the visibility and governance needed to manage an increasingly autonomous digital workforce.\nJoin us as we examine the next evolution of enterprise architecture and why successful AI adoption will depend not just on building intelligent agents, but on establishing a Lifecycle Governance framework that actually works."},{"id":4291,"day":"2026-10-28","start":"14:30","end":"14:55","room":"Room 103","title":"Frontier quality from a $0.50/MTok model: a context maturity framework for APIs","type":"talk","event":["Apidays"],"track":["Architecture for Strategy"],"speakers":[{"n":"Adeel Ali","c":"APIMatic.io","j":"Co-Founder & CEO"}],"desc":"AI coding agents are now among the fastest growing consumers of APIs, and they are remarkably good at producing integrations that compile, run and pass their tests. That is not the same as an integration you would trust with use cases like payments. In one recent migration of a payment API, a coding agent delivered clean code whose retry logic could charge a customer 4 times, and the test that checked it passed as well.\n\nThis talk looks at why that happens and what API providers can do about it. Drawing on 2026 researches from Ant Group and UC Berkeley, and on a 224 run benchmark across 7 models, it argues that many integration failures are information/context problems rather than reasoning problems. When agents received compiled API context, the cheapest model in the benchmark, at $0.50 per million tokens, matched a frontier model costing fifty times as much on the same integration task.\n\nThe session closes with a practical maturity model for making an API ready for agents, from documentation and contracts through production guidance to continuous verification, and with one question every API team should be able to answer: if an agent started integrating your API tomorrow, how much of what it needs to know would it have to discover for itself?"},{"id":4266,"day":"2026-10-28","start":"15:00","end":"15:25","room":"Room 106","title":"Unlearn with AI Evals","type":"talk","event":["Cloud Native Summit"],"track":[],"speakers":[{"n":"Everett Toews","c":"Deloitte","j":"Specialist Director at Deloitte NZ. Helping organisations establish"}],"desc":"Models change under us constantly and every release quietly shifts the line between what still works and what needs to be unlearned. The prompt scaffolding and workarounds you perfected for the last model are still in your fingers, your memory files, and your agent's system prompt. When the model changes, some of those won't work as well anymore, but nothing tells you which ones. AI evaluations (evals) can help draw that line.\n\nWe start with what it means to unlearn in the context of the AI era. Then we increase our understanding with an introduction to evals (ground truth, metrics, LLM-as-judge, etc). Followed by a walk-through of a real setup that tests new models against the prompts that matter to you. You'll leave knowing how to measure what changed, unlearn what no longer holds, and pick up what's improved."},{"id":4169,"day":"2026-10-28","start":"15:00","end":"15:25","room":"Room 104","title":"APIs in the Age of Agentic AI: Data Privacy With Rapid Innovation","type":"talk","event":["Apidays"],"track":["The Agentic Enterprise"],"speakers":[{"n":"Muhammad Abid Hasan","c":"Catholic Education Sandhurst Limited","j":"Solution Design Lead – Enterprise Platforms and Integration"}],"desc":"Autonomous AI agents are only as powerful as the data they can query, yet letting them loose on standard enterprise APIs creates a massive, high-stakes data privacy minefield. As organizations rush to deploy agentic automation, developers are caught in a brutal tug-of-war: business teams demand rapid innovation at breakneck speed, while compliance teams demand ironclad guardrails. Standard API security protocols simply weren't built to handle the unpredictable, dynamic pathways of autonomous LLMs. If you are still relying on static API keys and rigid perimeter security to protect your sensitive consumer data, your ecosystem is already exposed.\n\nDrawing directly from real-world enterprise digital transformations and complex multi-stream privacy implementations, this session cuts through the AI hype to address the technical reality of the field. We will explore how to stop treating data privacy as a late-stage roadblock and instead embed it directly into your core architectural design.\n\nAttendees will dive deep into a practical engineering playbook for building a dynamic, privacy-aware API gateway capable of enforcing real-time consent, risk mitigation, and strict data governance. They will leave this session not with a vague conceptual overview, but with a battle-tested blueprint to architect fast, secure, and compliant API ecosystems that can safely survive the AI era."},{"id":4292,"day":"2026-10-28","start":"15:00","end":"15:25","room":"Room 101 + 102","title":"APIs, AI and the Future of Digital Logistics","type":"talk","event":["Apidays"],"track":["Digital strategy"],"speakers":[{"n":"Saurav Rawal","c":"Truckit.net","j":"Head of Engineering"}],"desc":"Every day, trucks travel thousands of kilometres with unused capacity—or completely empty—while shippers are simultaneously searching for the right carrier to move their freight. This inefficiency creates unnecessary cost, operational complexity and environmental impact.\n\nAt Truckit.net, we are exploring how technology can help solve this matching problem more intelligently.\n\nIn this session, I’ll share our journey of building and evolving a digital freight marketplace, with a particular focus on how we think about matching freight with the right transport providers. We’ll explore how factors such as location, route, timing, vehicle capability, capacity and historical data can be brought together to identify better matching opportunities and help reduce empty truck movements.\n\nI’ll also discuss the role APIs play in connecting the different systems and data needed to make these decisions, and how AI and machine learning can take matching beyond simple rules toward more intelligent recommendations and predictions.\n\nRather than a deep dive into API specifications or algorithms, this is a practical look at how engineering, data, APIs and AI can work together to tackle a very physical, real-world problem: getting the right freight onto the right truck at the right time."},{"id":4288,"day":"2026-10-28","start":"15:00","end":"15:25","room":"Room 105","title":"The New Edge: Observability, Control and Trust at Runtime with AI","type":"talk","event":["Apidays"],"track":["APIs for AI"],"speakers":[{"n":"Michael Tran","c":"Datadog","j":"Enterprise Solutions Engineer"}],"desc":"As AI agents become autonomous and embedded across enterprise workflows, traditional security perimeters are no longer enough. This session explores how the security edge has shifted from static boundaries and cloud posture to agent runtime behavior. You will discover why securing AI agents requires an observability-first approach, how to detect compromised agent actions across prompts, skills, and MCPs, and the five core capabilities needed to establish real-time visibility, adaptive policies, and runtime protection in the new era of agentic scale."},{"id":4155,"day":"2026-10-28","start":"15:00","end":"15:25","room":"Room 103","title":"When APIs Become the Hands and Legs of AI: Securing Agentic Tool Calling with OAuth Token Exchange and Fine-Grained Authorisation","type":"talk","event":["Apidays"],"track":["Architecture for Strategy"],"speakers":[{"n":"Hemanth Thirtha Prasad","c":"Auth0","j":"Associate Solutions Engineer"}],"desc":"AI agents break API security models built for humans or scripts. Learn how to replace static keys with dynamic tokens, secure multi-tenant data, and keep humans in the loop for high-stakes actions."},{"id":4267,"day":"2026-10-28","start":"15:30","end":"15:45","room":"Room 106","title":"Mandatory or Optional: What the Data Says About Platform Adoption","type":"talk","event":["Cloud Native Summit"],"track":[],"speakers":[{"n":"Charlotte \tFleming","c":"Octopus Deploy","j":"Researcher | PhD in Neuroscience"}],"desc":"Platform Engineering has matured rapidly from a frontier practice to a mainstream industry-standard. Drawing on Octopus Deploy's Future of Platform Engineering research, this talk presents what the data shows about platform adoption across organizations, and what separates the platforms delivering real value from those that don't.\n\nThe findings challenge some common assumptions. Mandated adoption consistently outperforms optional. And what platform builders believe they've delivered rarely matches what developers report experiencing, a pattern that shows up repeatedly in underperforming platforms.\n\nThe data also surfaces where platforms stall. Build-versus-buy decisions, unclear success metrics, and unanticipated obstacles are recurring themes among platforms that lose momentum after launch. What gets measured, and how teams decide what to build next, turns out to matter as much as the initial architecture.\n\nThis talk examines the adoption, decision-making, and organizational dynamics that tend to receive less attention than the engineering, and what the data suggests about where effort is most often misplaced."},{"id":4180,"day":"2026-10-28","start":"15:30","end":"15:55","room":"Room 105","title":"From Black Box to Governed Agent","type":"talk","event":["Apidays"],"track":["APIs for AI"],"speakers":[{"n":"Jon Scheele","c":"Blue Connector","j":"Founder & Principal Consultant"}],"desc":"AI coding assistants are now standard on engineering teams across regulated industries, but rollout speed is outpacing governance. This session presents a practical framework — built around three questions: what can the tool touch, what triggers mandatory human review, and how do you give it enough context to generate aligned code in the first place. Drawing on NIST's AI Risk Management Framework and Singapore's MAS AI governance model, the talk moves beyond \"\"black box\"\" anxiety toward a concrete, auditable approach to human-centric AI software governance.\n\nKey takeaways:\n• A three-question framework for governing AI-generated code at the team level\n• How NIST AI RMF and MAS's approach translate into day-to-day engineering practice\n• A practical line between routine AI-assisted changes and those requiring human sign-off"},{"id":4214,"day":"2026-10-28","start":"15:30","end":"15:55","room":"Room 103","title":"Scaling Agentic AI Across the Enterprise: Evolving Ecosystems to Drive Innovation, Governance and Cost Efficiency","type":"talk","event":["Apidays"],"track":["Architecture for Strategy"],"speakers":[{"n":"Alejandra Leon","c":"BHP","j":"Manager AI Delivery and Development"}],"desc":"In this session, Alejandra Leon explores how organizations can move from experimentation to repeatable, governed, and measurable enterprise AI capability. The focus starts with the business problem and ROI, not the technology and follows the journey through multidisciplinary delivery, reusable architecture patterns, governance and security by design, and operationalization through Agentic AIOps and CI/CD.\n\nThe session also challenges organizations to look beyond token pricing and instead optimize for cost per successful business outcome, balancing quality, risk, performance, and cost.\n\nAttendees will leave with practical principles for evolving from isolated Agentic AI experiments to an enterprise ecosystem that can innovate faster, operate responsibly, and scale with confidence."},{"id":4067,"day":"2026-10-28","start":"15:30","end":"15:55","room":"Room 104","title":"Beyond the Pilot: Leading the Autonomous Enterprise in the Agentic Era","type":"keynote","event":["Apidays"],"track":["The Agentic Enterprise"],"speakers":[{"n":"Su Jella","c":"Torrens University","j":"Lecturer and Subject Architect"}],"desc":"In 2026, the question for leaders has shifted from \"\"How do we use AI?\"\" to \"\"How do we lead an organisation that is agent-orchestrated?\"\" As we move away from human-led digital workflows toward autonomous API stacks, leadership requires a fundamental pivot: moving from managing tasks to governing outcomes.\n\nIn this topic, I will explore the rise of the Sovereign Autonomous Enterprise. I will dissect why \"\"Black Box Dependency\"\" is the greatest strategic risk of 2026 and how leaders can build resilient, independent AI ecosystems that respect regional data residency without sacrificing innovation. You’ll learn how to bridge the gap between C-suite strategy and API architecture, ensuring your \"\"digital workers\"\" are aligned with human values, operational continuity, and the bottom line.\n\nKey Takeaways:\n\nArchitecting Autonomy: Moving from \"\"Copilots\"\" to independent Agentic workflows via robust API orchestration.\n\nThe Sovereignty Mandate: Strategies for maintaining operational control when your enterprise \"\"brains\"\" live in the cloud.\n\nHuman-Centric ROI: How to reskill teams to manage AI agents rather than just using them as tools.\n\nJoin me to redefine the boundary between human intuition and machine execution."},{"id":4385,"day":"2026-10-28","start":"15:30","end":"15:55","room":"Room 101 + 102","title":"Beyond API Integration: Connecting AI to Business Outcomes","type":"talk","event":["Apidays"],"track":["Digital strategy"],"speakers":[{"n":"Satya Chunduru","c":"Enterprise Technology Executive","j":"Creator of the 3A™ Framework | Align • Augment • Achieve"}],"desc":"Beyond API Integration: Connecting AI to Business Outcomes\n\nAs organisations accelerate AI adoption, APIs are becoming increasingly important in connecting enterprise systems, data, knowledge, AI agents and business services. However, technical integration alone does not guarantee business value.\n\nMany organisations successfully connect systems and develop AI solutions but struggle to translate these capabilities into scalable, measurable business outcomes. The challenge extends beyond technology to aligning enterprise capabilities, trusted knowledge, business decisions, governance and AI-enabled actions.\n\nThis session introduces the 3A™ Framework (Align • Augment • Achieve), a technology-agnostic enterprise architecture approach designed to bridge the gap between AI ambition and business outcomes.\n\nUsing a practical enterprise scenario, we will explore how APIs enable AI agents to access trusted enterprise knowledge, interact with business services, support informed decisions and execute governed actions.\n\nThe session will also demonstrate how enterprise architecture provides the broader context for identifying capability gaps, connecting existing investments and aligning API-enabled AI initiatives with business priorities.\n\nKey takeaways include:\n\nUnderstanding the evolving role of APIs in enterprise AI adoption.\nConnecting enterprise knowledge, decision intelligence, AI agents and business services.\nApplying architecture and governance principles to enable scalable, accountable AI adoption.\nMoving beyond technical connectivity towards measurable business outcomes.\n\nThe central message: APIs enable connectivity. Enterprise architecture helps turn that connectivity into business value."},{"id":4268,"day":"2026-10-28","start":"15:45","end":"16:00","room":"Room 106","title":"TBA","type":"talk","event":["Cloud Native Summit"],"track":[],"speakers":[],"desc":""},{"id":4059,"day":"2026-10-28","start":"16:00","end":"16:20","room":"","title":"Coffee Break / Networking / Expo","type":"break","event":["Apidays","Cloud Native Summit"],"track":[],"speakers":[],"desc":""},{"id":4269,"day":"2026-10-28","start":"16:20","end":"16:45","room":"Room 106","title":"Who ordered all these tokens? Managing your AI costs.","type":"talk","event":["Cloud Native Summit"],"track":[],"speakers":[{"n":"Sonia Cuff","c":"Microsoft","j":"Cloud Advocate"}],"desc":"Tokenmaxxing is out. The brakes are on AI spending unless it's delivering value and we can show business ROI. Learn how the Tokenomics Foundation is tackling this, and how the FinOps Framework provides the cross-functional collaboration and data-driven visibility you need to scale your AI workloads with confidence."},{"id":4072,"day":"2026-10-28","start":"16:20","end":"16:45","room":"Room 104","title":"Beyond Vibe Coding: Is Spec-Driven Development Ready for Enterprise Integration?","type":"talk","event":["Apidays"],"track":["The Agentic Enterprise"],"speakers":[{"n":"Nikolai Blackie","c":"Adaptiv","j":"CTO/Co-Founder of Adaptiv"}],"desc":"AI agents speed up enterprise integration, but incomplete requirements and production complexity expose vibe coding’s limits. Can spec-driven development build trust across Azure, MuleSoft and Boomi?"},{"id":4202,"day":"2026-10-28","start":"16:20","end":"16:45","room":"Room 103","title":"Beyond the Gateway: Agents Have Already Found Your Blind Spots. Have You?","type":"talk","event":["Apidays"],"track":["Architecture for Strategy"],"speakers":[{"n":"Shahnawaz Backer","c":"F5 Labs","j":"Director Solutions Engineering"}],"desc":"Your API gateway only protects the APIs it knows about, and in most organizations that’s a fraction of what’s actually running. Deprecated versions nobody switched off. Internal services exposed during a migration. LLM wrappers and vector database connectors spun up for a quick experiment and never registered. These shadow and zombie APIs live outside the gateway, outside security policy and outside anyone’s view.\n\nAutonomous agents turn this blind spot into an open door. Give an agent tools and a task, and it will use whatever endpoint gets the job done. It reads documentation, follows links in responses, tries older API versions and chains calls across services with a speed and persistence no human can match. Whether it’s hijacked by prompt injection or simply over-eager, an agent will find the undocumented endpoint with missing authorization checks, then exploit broken object-level authorization, excessive data exposure or unrestricted resource consumption, without ever touching the gateway you secured.\n\nThis session shows why inventories built on developer-submitted OpenAPI specs fall short, and how continuous runtime discovery from live traffic and gateway telemetry reveals what’s really exposed. You’ll leave with a practical playbook to:\n\n• Discover every live endpoint, including shadow, zombie and AI-specific APIs, across multi-cloud and container environments\n\n• Classify APIs by sensitivity and function, from inference to retrieval to tool endpoints, so controls follow the data\n\n• Enforce positive security, drift detection and scoped authorization everywhere, not just at the gateway\n\n• Detect the difference between an agent doing its job and an agent mapping your attack surface\n\nYour agents already know what you’re exposing. It’s time you did too."},{"id":4183,"day":"2026-10-28","start":"16:20","end":"16:45","room":"Room 101 + 102","title":"Preparing Enterprise IT for the Agentic AI Tsunami","type":"talk","event":["Apidays"],"track":["Digital strategy"],"speakers":[{"n":"Claudio Tag","c":"IBM APAC","j":"CTO Automation"}],"desc":"AI Agents are here — and they're exposing (and often exploiting) every crack in your enterprise IT foundation. Fragmented monitoring, inefficient integrations, stale context management, ungoverned identities, and spiralling costs aren't isolated IT problems — they're existential risks. Rolling out agents at enterprise-scale has proven near impossible — but why? Memory limitations, inconsistent tool quality, and neglected fundamentals like identity, governance, and AgentOps are killing pilots before they ever reach production.\nOrganisations need an Enterprise approach to Agentic AI: an evolving reference architecture and a practical maturity model to adopt AI Agents at scale — covering unified observability, continuous exposure management, AI Gateways, Agentic identity, and the true cost of AI at scale. The tsunami isn't coming. It's already hitting shore."},{"id":4181,"day":"2026-10-28","start":"16:20","end":"16:45","room":"Room 105","title":"From OpenAPI to MCP: Making Existing APIs Agent-Ready","type":"talk","event":["Apidays"],"track":["APIs for AI"],"speakers":[{"n":"Cliffano Subagio","c":"Shine Solutions","j":"Principal Engineer"}],"desc":"OpenAPI revolutionized API consumption by enabling documentation, validation, and SDK generation from machine-readable contracts. As AI agents become a new class of API consumers, organizations face a new challenge: exposing existing capabilities to agents without rebuilding integrations.\n\nThis talk explores how OpenAPI specifications can serve as the foundation for generating Model Context Protocol (MCP) servers, creating an agent-facing layer on top of existing web APIs. Through practical demonstrations, we show how API operations, parameters, and schemas can be transformed into structured tools that AI agents can discover and invoke.\n\nBeyond implementation, we examine the architectural implications of supporting autonomous agents as consumers, including discoverability, governance, authentication, observability, and safety boundaries. Rather than replacing existing APIs, MCP enables organisations to extend them using the contracts they already maintain.\n\nAttendees will gain practical approaches for evolving existing API ecosystems into agent-ready platforms while preserving established governance and operational controls.\n\nThis talk supports MCP adoption by demonstrating how existing OpenAPI specifications can be repurposed into agent-accessible interfaces without creating custom integrations or rewriting APIs. By building on established API contracts, organizations can accelerate AI adoption while maintaining consistency and interoperability."},{"id":4126,"day":"2026-10-28","start":"16:50","end":"17:15","room":"Room 103","title":"Applying the OWASP Top 10 for Agentic Applications to Your AI Agents","type":"talk","event":["Apidays"],"track":["Architecture for Strategy"],"speakers":[{"n":"Will Velida","c":"Microsoft","j":"Senior Software Engineer"}],"desc":"The OWASP Top 10 fo
