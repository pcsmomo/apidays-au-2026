r Agentic Applications (2026) identifies the most critical security risks facing AI agents, from goal hijacking and tool misuse to identity abuse, memory poisoning, and cascading failures. But the guidance stops at \"what,\" not \"how.\" This talk bridges the gap between framework and implementation. Using my personal health agent as an example, I'll walk through every applicable OWASP Agentic risk and show the exact code, infrastructure, and architecture decisions that mitigate each one."},{"id":4073,"day":"2026-10-28","start":"16:50","end":"17:15","room":"Room 104","title":"Is API or MCP the Future? Rethinking Integration in the Age of AI Agents","type":"talk","event":["Apidays"],"track":["The Agentic Enterprise"],"speakers":[{"n":"Krishan Wijesena","c":"WSO2 LLC","j":"Senior Technical Lead"}],"desc":"For over a decade, APIs have been the foundation of digital platforms, enabling reliable, contract-driven integration across systems. With the rise of AI agents and tool-aware models, a new question is emerging: Are APIs still enough, or is Model Context Protocol (MCP) the future of integration?\nThis session examines how MCP introduces a fundamentally different interaction model one optimized for AI systems that discover, reason over, and invoke tools dynamically based on context. We will contrast traditional API-driven architectures with MCP-based approaches, exploring differences in control flow, coupling, governance, and operational visibility.\nRather than positioning MCP as a replacement for APIs, this talk presents a pragmatic view of how the two models address different problem spaces. Through real-world architectural patterns, attendees will learn where APIs remain indispensable, where MCP unlocks new capabilities, and how hybrid platforms can evolve to support both without compromising security, governance, or scalability.\nBy the end of the session, architects and engineers will have a clear perspective on how integration is evolving and what “the future” realistically looks like for API platforms in an AI-driven world."},{"id":4182,"day":"2026-10-28","start":"16:50","end":"17:15","room":"Room 105","title":"You Approved the Intent and Your API Should Approve the Route","type":"talk","event":["Apidays"],"track":["APIs for AI"],"speakers":[{"n":"Sagara Gunathunga","c":"WSO2","j":"Head of DevRel - IAM, WSO2"}],"desc":"A person's AI assistant booked him a gym class by finding an API that never checked authorization. It moved him up the waitlist by cancelling someone else's reservation, further ahead than the rules allowed. That is a real story, and there are others on record. OpenAI, Anthropic, and Meta have all disclosed that their models reached real systems over the internet, including one agent that broke out of an evaluation environment into four accounts across four third-party services. Every one of these was found retrospectively, or by accident.\n\nThe problem is not the AI. The API had no way to know that an agent, rather than the account holder, made the call. Agents today borrow a human identity or a workload identity, and neither fits. A human identity carries accountability an agent cannot inherit. A workload identity assumes a route that was coded and reviewed in advance.\n\nThis talk shows how agents borrow identity today: through tokens that carry no reference to the agent, and through browser sessions they simply inherit. It argues that the API layer already knows how to tell a human apart from a deterministic application following a hardcoded, tested, predetermined route. What it does not yet do is repeat that exercise for an agent, whose route is not fixed in advance but chosen autonomously and adapted request by request. That gap is why an identity of the agent's own is a fundamental necessity."},{"id":4184,"day":"2026-10-28","start":"16:50","end":"17:15","room":"Room 101 + 102","title":"Capability Engineering: A New Discipline for the AI-Native Enterprise","type":"talk","event":["Apidays"],"track":["Digital strategy"],"speakers":[{"n":"Azwaan Ameer","c":"Avanade","j":"Senior Application Architect"}],"desc":"AI is making individual tasks dramatically faster. But faster tasks do not automatically create a more capable organisation.\n\nKnowledge remains fragmented, AI initiatives remain isolated, and valuable discoveries are repeatedly recreated rather than becoming reusable organisational capability.\n\nThrough my work applying AI to real organisational problems, I developed and refined an approach I call Capability Engineering - a structured engineering model for using AI to build and uplift organisational capability. It brings together clear intent, organisational knowledge, reusable AI-enabled abilities and systematic execution, moving beyond ad-hoc AI assistance towards capabilities that can be deliberately engineered, reused and evolved.\n\nThis session introduces the model, how it emerged through practical application, and lessons from validating it across real capability scenarios.\n\nAt its heart is a bigger question:\n\n**What if we could engineer what an organisation becomes capable of doing - not just the systems it builds?"},{"id":4270,"day":"2026-10-28","start":"16:50","end":"17:15","room":"Room 106","title":"AI native platform engineering: building the platform when agents are the primary consumer","type":"talk","event":["Cloud Native Summit"],"track":[],"speakers":[{"n":"Jeffrey Aven","c":"StackQL Studios","j":"Co-founder"}],"desc":"Platform engineering built its playbook for human consumers: portals, golden paths, self-service templates, and review gates. AI agents break most of those assumptions — they do not click through portals, they do not wait for reviews, and they consume capability at machine speed.\n\nThis session looks at what changes when agents become first-class consumers of your internal platform, drawn from production experience building an agent-facing control plane across multiple cloud providers. We cover what agents actually need from a platform: queryable live state rather than dashboards, machine-enforceable policy rather than human review gates, and discoverable capability rather than documentation.\n\nWe look at interface design for agent consumers — why exposing platform capability as a uniform query and provisioning surface beat a catalogue of bespoke tools, and what that did to context size and reliability — and at guardrails as platform features: read-only defaults, query-before-mutation, and policy gates enforced at the interface.\n\nIncludes a live demo of an agent consuming platform capability end to end, from natural language question to policy-gated change, and an honest account of what we got wrong first. All patterns shown are tool-agnostic, demonstrated with open source software."},{"id":4151,"day":"2026-10-28","start":"17:20","end":"17:20","room":"","title":"End of Day 1","type":"break","event":["Apidays","Cloud Native Summit"],"track":[],"speakers":[],"desc":""},{"id":4149,"day":"2026-10-29","start":"09:00","end":"09:30","room":"","title":"Welcome Breakfast","type":"break","event":["Apidays"],"track":[],"speakers":[],"desc":""},{"id":4150,"day":"2026-10-29","start":"09:30","end":"09:40","room":"Room 109 + 110","title":"Opening Remarks","type":"opening_remarks","event":["Apidays"],"track":[],"speakers":[{"n":"Mehdi Medjaoui","c":"Founder and Chairman of Apidays Conferences","j":"Author of Continuous API Management"}],"desc":""},{"id":4079,"day":"2026-10-29","start":"09:40","end":"10:05","room":"Room 109 + 110","title":"If you thought the speed of writing code was your problem, you have bigger problems","type":"keynote","event":["Apidays"],"track":["keynote"],"speakers":[{"n":"Andrew Murphy","c":"Debugging Leadership","j":"CEO"}],"desc":"AI can write code faster than you. Congratulations to the robots. But if speed of code production is the thing holding your team back, I've got some uncomfortable news: you have much bigger problems and nobody is willing to talk about them.\n\nI've spent over 25 years building software and the bottleneck was almost never the typing. It was the three-week argument about what to build. The requirements that changed after you shipped. The stakeholder who couldn't articulate what they actually needed. The architectural decision nobody wanted to own."},{"id":4248,"day":"2026-10-29","start":"09:40","end":"10:10","room":"Room 106","title":"Making Production Legible to Agents: Lessons from Building an Observability MCP","type":"keynote","event":["Cloud Native Summit"],"track":[],"speakers":[{"n":"Liz  Fong-Jones","c":"honeycomb","j":""}],"desc":"An agent that can query production telemetry can test its own hypotheses against reality, rather than hallucinate fictions. Observability tooling allows our agents to close the loop and benefit from production wisdom. Today, more than 40% of Honeycomb's weekly active users run production queries through our MCP server via their agents.\n\nBut an MCP server must do more than wrap existing APIs to be legible to the agents. Getting token economy, tool descriptions, or schemas wrong makes access technically present but practically useless. I'll walk through the output format choices, decisions from evals, and bugs (solved and still being found) that made ours trustworthy in production, enabling users and their agents to see clearly in production."},{"id":4186,"day":"2026-10-29","start":"10:05","end":"10:30","room":"Room 109 + 110","title":"Integration in an AI World: Building for Humans, Systems, and Agents","type":"keynote","event":["Apidays"],"track":["keynote"],"speakers":[{"n":"Dan Toomey","c":"Deloitte","j":"Integration Specialist"}],"desc":"As AI agents become first‑class consumers of APIs, integration is no longer plumbing — it’s the execution layer of intelligent systems. In this session, we explore how AI is reshaping the way integrations are designed, built, and governed, and why traditional approaches break down when code is generated, orchestrated, and debugged by machines.\n\nYou’ll learn what “agent‑ready” APIs really require, how AI accelerates integration while introducing new risks, and how Microsoft’s integration and AI stack can help teams build reliable, observable, and governable workflows in an AI‑generated world.\n\nExpect practical insights, a fast‑paced demo, and a clear roadmap for preparing your APIs and integration landscape for the agentic era."},{"id":4249,"day":"2026-10-29","start":"10:10","end":"10:40","room":"Room 106","title":"AI SDLC At Scale - From Cloud Agent Spaces To Headless Agents Next To Repos","type":"keynote","event":["Cloud Native Summit"],"track":[],"speakers":[{"n":"Rebecca Ye","c":"Deloitte","j":"Senior Engineer"}],"desc":"Agents are moving off your laptop into the cloud and pipelines - containerised, repo-connected and always on. Here's what we build on top of our foundations."},{"id":4060,"day":"2026-10-29","start":"10:30","end":"11:00","room":"","title":"Coffee Break / Networking / Expo","type":"break","event":["Apidays","Cloud Native Summit"],"track":[],"speakers":[],"desc":""},{"id":4135,"day":"2026-10-29","start":"11:00","end":"11:25","room":"Room 103","title":"Building Customer Trust: Turning composable APIs into telco Innovation","type":"talk","event":["Apidays"],"track":["Digital mindset"],"speakers":[{"n":"Felton Xu","c":"Optus","j":"Associated Director - Product Architecture"}],"desc":""},{"id":4075,"day":"2026-10-29","start":"11:00","end":"11:25","room":"Room 101 + 102","title":"Managing cloud infrastructure with CDKTF","type":"talk","event":["Apidays"],"track":[],"speakers":[{"n":"Artem Koshelev","c":"Atlassian","j":"Principal Engineer"}],"desc":"While building platform support for Atlassian Isolated Cloud offering, we needed a tool for infrastructure management. In this talk I want to explore with you, why we ended up using CDKTF, where it's falling short and how we addressed some of the gaps."},{"id":4170,"day":"2026-10-29","start":"11:00","end":"11:25","room":"Room 105","title":"The API-First Payment Orchestrator: Why We Chose a Modular Monolith","type":"talk","event":["Apidays"],"track":["API & AI in Banking and finance"],"speakers":[{"n":"Liam Ford","c":"Commonwealth Bank","j":"Principal Engineer"}],"desc":"Over the past decade, I've worked as a Principal Engineer across three major banks, helping design and evolve large-scale payment platforms and APIs. One lesson I've learned is that while microservices are often seen as the default architecture for modern systems, they're not always the right answer.\n\nIn this talk, I'll share the thinking behind building an API-first payment orchestrator using a modular monolith, drawing on real-world experience delivering systems that need to balance reliability, maintainability, performance, and the ability to evolve over time. Rather than debating monoliths versus microservices, I'll explore the practical engineering decisions that shaped the architecture, the trade-offs we considered, and the lessons we learned along the way.\n\nWe'll cover topics including API-first design, domain-driven design, modular boundaries, team ownership, deployment, testing, and how to scale a modular monolith without sacrificing developer productivity or creating unnecessary operational complexity. I'll also discuss the indicators that suggest it's time to consider microservices, and when it isn't.\n\nThis session is for architects, engineering leaders, and software engineers who want to move beyond architectural trends and make decisions based on context, business needs, and engineering outcomes. Attendees will leave with practical patterns and a decision-making framework they can apply to their own systems."},{"id":4161,"day":"2026-10-29","start":"11:00","end":"11:25","room":"Room 104","title":"Federation for the JVM","type":"talk","event":["GraphQL Day"],"track":[],"speakers":[{"n":"Andreas Marek","c":"Feddi","j":"CTO"}],"desc":"Feddi gateway is the first open source implementation of the community driven GraphQL spec. This talk will introduce feddi gateway."},{"id":4250,"day":"2026-10-29","start":"11:00","end":"11:25","room":"Room 106","title":"Agentic SRE: Moving from Alerting to Autonomous Remediation in Day-2 Operations","type":"talk","event":["Cloud Native Summit"],"track":[],"speakers":[{"n":"Anupam Phoghat","c":"Core-X","j":"Founding Director"}],"desc":"Modern cloud-native infrastructure generates more alerts than human engineers can ever realistically handle. We are stuck in a loop of getting paged, checking Grafana, and executing runbooks. It's time to move past static alerting and build systems that can actually fix themselves.\n\nThis session bridges the gap between traditional infrastructure-as-code and Generative AI for Day-2 operations. I will demonstrate how to build an \"\"Agentic SRE\"\" workflow that doesn't just page you — it investigates. We will walk through a practical, production-ready event-driven architecture that catches Prometheus webhooks, passes the payload to an LLM to query open-source telemetry for context, and finally proposes safe infrastructure-as-code fixes via Terraform and kubectl. This isn't sci-fi; it's just smart orchestration. You will leave with a clear roadmap for implementing AI-driven incident response in your own high-scale Kubernetes environments."},{"id":4076,"day":"2026-10-29","start":"11:30","end":"11:55","room":"Room 103","title":"Why LLMs Fall for Stories (And 5 Production Patterns That Actually Stop Them)","type":"talk","event":["Apidays"],"track":["Digital mindset"],"speakers":[{"n":"Mal\tCurtis","c":"Nvidia","j":"Principal Software Engineer"}],"desc":"AI-native API development is facing a reliability crisis. Hallucinated responses slip through testing, token costs grow uncontrollably, response formats drift between requests, and latency spikes cascade through downstream systems. Most teams treat these as entirely new AI-era problems — but many of them are fundamentally operational and quality-engineering failures that manufacturing solved decades ago.\n\nThis talk explores how the principles behind the Toyota Production System can be directly applied to modern AI-native architectures built on LLMs, agents, and RAG pipelines. Using real-world API failure modes as the starting point, the session maps six lean engineering principles onto the AI API lifecycle: automated quality gates that stop unsafe deployments, continuous improvement loops for prompts and retrieval systems, trace-driven debugging instead of dashboard-driven assumptions, workload leveling for unpredictable AI traffic, elimination of token waste and schema drift, and guardrails that make invalid AI behaviour impossible rather than merely detectable.\n\nRather than focusing on model hype or framework churn, the talk reframes AI reliability as an engineering discipline problem. The session provides a practical mental model for building observable, governable, and accountable AI systems in production. Attendees will leave with concrete implementation patterns, a production-ready checklist, and a lean systems approach for turning AI from a probabilistic black box into an operationally trustworthy platform."},{"id":4136,"day":"2026-10-29","start":"11:30","end":"11:55","room":"Room 105","title":"LLM First vs Code First for Trusted Agentic APIs","type":"talk","event":["Apidays"],"track":["API & AI in Banking and finance"],"speakers":[{"n":"Swapneswar Sundar Ray","c":"US Bank","j":"Assistant Vice President - AI Engineering"}],"desc":""},{"id":4162,"day":"2026-10-29","start":"11:30","end":"11:55","room":"Room 104","title":"Closing the Loop: How GraphQL Gives Coding Agents Eyes on What Actually Matters","type":"talk","event":["GraphQL Day"],"track":[],"speakers":[{"n":"Michael Staib","c":"ChilliCream","j":"Founder"}],"desc":"Coding agents are reshaping how we build software. Implementing features, refactoring systems, and shipping changes at a pace unthinkable 6 months ago. But to be successful with agents you need the right feedback loop. One that guides your agent to success, not into the spiral of death.\n\nAsk Claude to add a review system to your product API. Without knowing what's in use, it might reshape your types, move fields, and break your deployed clients because it is missing a crucial feedback loop of what's in use in your clients.\n\nGraphQL changes this. Every client operation explicitly declares the exact fields and types it needs. That gives you something rare: field-level usage data across your entire consumer base. Not endpoint hits, but actual demand, broken down to the individual field.\n\nWhen coding agents can access this data, they stop guessing. Evolve your schema grounded in reality, not assumptions.\n\nThis talk shows how GraphQL's inherent usage visibility and the rise of coding agents create a feedback loop that didn't exist before. And why it matters for anyone building APIs that need to evolve fast."},{"id":4077,"day":"2026-10-29","start":"11:30","end":"11:55","room":"Room 101 + 102","title":"A Multi-Agent BaaS Architecture for Real-Time Investigation Using Dify","type":"talk","event":["Apidays"],"track":[],"speakers":[{"n":"Ramachandra Prabu Muralimohan","c":"","j":"Engineering Manager"}],"desc":"Most teams building multi-agent AI hit the same fork: hand-roll orchestration with something like LangGraph, or compose it on a Backend-as-a-Service platform and skip building the engine. This talk makes the case for the second path — using Dify to turn a multi-agent investigation workflow into a governed REST API in hours, not weeks. I'll break down what \"composing agents as an API\" actually means: specialist agents running in parallel, each scoped like its own microservice, merged by a synthesizer into one ranked, cited response — then call it live, the way any consumer system would, and watch the real request and response. If you're weighing whether your next agentic system needs a custom orchestration layer or just a well-designed API contract, this is that talk."},{"id":4252,"day":"2026-10-29","start":"11:30","end":"11:55","room":"Room 106","title":"How to keep APIs safe in the age of AI","type":"talk","event":["Cloud Native Summit"],"track":[],"speakers":[{"n":"Danny Tran","c":"NAB","j":"Senior Software Engineer"},{"n":"Liam Byrne","c":"Tetrate","j":"Software Engineer"}],"desc":"AI is speeding up how vulnerabilities are found and exploited, so API owners must move faster too.\n\nDanny (NAB) and Liam (Tetrate) share NAB's journey from Kubernetes NGINX ingress to Istio and Tetrate Service Bridge in a regulated environment. They'll cover mTLS, SPIFFE workload identity, zero-trust enforcement between services, centralised policies across clusters, and how TSB uses AI to rapidly respond to new vulnerabilities.\n\nAttendees will leave knowing how to sequence a migration off ingress-based routing without a big-bang cutover, how workload identity replaces network-location trust and what that changes for API owners, how to apply policies fleet-wide in minutes rather than app by app, and where AI-assisted vulnerability response helps versus where a human still belongs in the loop."},{"id":4384,"day":"2026-10-29","start":"11:30","end":"11:55","room":"Room 105","title":"From v51 to v72: What It Takes for AI Agents to Migrate Financial APIs?","type":"talk","event":["Apidays"],"track":["API & AI in Banking and finance"],"speakers":[{"n":"Adeel Ali","c":"APIMatic.io","j":"Co-Founder & CEO"}],"desc":"Releasing a new API version is relatively easy. Getting thousands of existing integrations to adopt it is a different challenge. For payment platforms, fintechs and financial API providers, this often means maintaining older versions for years, even when better alternatives are available. Australia’s Consumer Data Right offers a familiar example of how complicated API version transitions can become.\n\nAI coding agents could change this equation, but how much can we trust them with migrations that involve real financial transactions?\n\nIn this talk I'll share the migration experience from version 51 to version 72 of a leading payment provider’s Checkout API. I'll share the problems the AI overlooked, even though the code compiled and ran fine. Drawing on this migration, I’ll show how versioned API context changed the agent’s implementation, what it fixed, and where the limitations remain. More importantly, I’ll explore what API providers can do to make their APIs easier for agents to consume safely as versions evolve."},{"id":4253,"day":"2026-10-29","start":"12:00","end":"12:25","room":"Room 106","title":"Give Your AI Agents a Sandbox: Running Untrusted Agent Code Safely on Kubernetes","type":"talk","event":["Cloud Native Summit"],"track":[],"speakers":[{"n":"Aditya Joshi","c":"Walmart","j":"Senior Software Engineer"}],"desc":"AI agents are getting alarmingly good at writing code - and then running it. But where does that code actually execute? Far too often it's eval() in your app process or a shared container with a mounted service account token. That's a security incident waiting for a stack trace.\n\nThis talk introduces Agent Sandbox, a Kubernetes SIG project that turns the cluster into a purpose-built execution layer for untrusted agent code. We'll cover the new CRDs - SandboxTemplate, SandboxWarmPool, and the sandbox router - and show how gVisor isolation, dropped capabilities, and disabled token automounting give you defense in depth. Then we'll go live: spinning up a hardened Python sandbox from a warm pool in under a second, running agent-generated code, and tearing it down. Come for the demo, leave with a threat model."},{"id":4166,"day":"2026-10-29","start":"12:00","end":"12:25","room":"Room 104","title":"Beyond the Experience Graph: The Data Graph Meets AI","type":"talk","event":["GraphQL Day"],"track":[],"speakers":[{"n":"Eddy Nguyen","c":"Seek","j":"Lead Engineer"}],"desc":"Most of us know GraphQL as the \"\"Experience Graph\"\", shaped around screens and clients. But GraphQL can be used elsewhere in your architecture: as a Data Graph, a strongly-typed abstraction directly over your data layer, giving every consumer - services and AI agents alike - a single place to access all your data.\n\nIn this talk, I'll show how modelling your databases behind a GraphQL schema gives you a self-describing, introspectable contract and why that turns out to be a remarkably good surface for AI. Through demos, we'll see AI agents introspect a Data Graph to explore data, assist developers in writing and refining queries, and even propose schema improvements by spotting gaps and ambiguities humans miss.\n\nYou'll leave with a clear mental model of when a Data Graph makes sense, how it differs from the experience graph you already know, and practical patterns for making your graphs AI-ready."},{"id":4294,"day":"2026-10-29","start":"12:00","end":"12:25","room":"Room 103","title":"Cyber Smart, AI Ready: Building Trust in a Digital World","type":"talk","event":["Apidays"],"track":["Digital mindset"],"speakers":[{"n":"Varsha Manek","c":"Kindify pty ltd","j":"Founder- Kindify"}],"desc":"Generative AI is changing how we work, learn and deliver services—but adopting it responsibly requires more than a policy. It requires people who understand the risks and know how to make informed decisions every day.\n\n“Cyber Smart, AI Ready” explores the human side of sovereign intelligence: how organisations can."},{"id":4293,"day":"2026-10-29","start":"12:00","end":"12:25","room":"Room 105","title":"The API Call Was Valid. The AI Agent's Action Wasn't.","type":"talk","event":["Apidays"],"track":["API & AI in Banking and finance"],"speakers":[{"n":"Haibin Li","c":"Haibin CanFixIT","j":"Senior Software Engineer"}],"desc":"AI agents are evolving from assistants that recommend actions into autonomous systems that call APIs, exchange data, and initiate payments. But a valid API credential doesn't necessarily prove that an agent's specific action was authorised by the human it represents.\n\nImagine an AI agent approved to summarise a dataset. What happens when it attempts to export that same dataset using identical credentials and payment details? How can the API distinguish an authorised action from an unauthorised one?\n\nThis talk explores a practical approach to \"verifiable, human-delegated authorization for autonomous AI agents\".\n\nDrawing on my work developing Virtual Haibin, an experimental AI-agent authorization and payment system, I'll demonstrate how cryptographically signed permissions can bind human approval to specific operations and resources. A live demonstration will show two otherwise identical API transactions producing different outcomes: one allowed, the other rejected.\n\nWe'll examine how this approach complements existing OAuth and API security models, along with practical challenges including replay protection, revocation, independent verification, and auditability.\n\nAs AI agents increasingly interact with services and other agents, API security must evolve beyond verifying \"who is calling\" to establishing \"what they are actually authorised to do\"."},{"id":4375,"day":"2026-10-29","start":"12:00","end":"12:55","room":"Room 101 + 102","title":"Production Ready Agents: Orchestration Lab","type":"workshop","event":["Apidays"],"track":["Workshops"],"speakers":[{"n":"Viren Baraiya","c":"Orkes","j":"Co-Founder & CTO"}],"desc":"Learn how to build and run production-grade AI agents on Orkes Conductor. Combine durable, deterministic workflows with LLM agents for reasoning and synthesis."},{"id":4262,"day":"2026-10-29","start":"12:30","end":"12:55","room":"Room 106","title":"Achieving Sovereign AI with an Open Source Stack","type":"talk","event":["Cloud Native Summit"],"track":[],"speakers":[{"n":"Kanchana Wickremasinghe","c":"WSO2","j":"Vice President & General Manager API & Integration"}],"desc":"As AI adoption accelerates, a new question has moved from policy think-tanks to enterprise boardrooms: who controls your AI?\n\nSovereign AI — the ability to design, deploy, and govern artificial intelligence while maintaining full control over data, infrastructure, models, and governance frameworks — has become a top priority for governments and enterprises alike. The European Commission's June 2026 Tech Sovereignty Package, the EU AI Act's compliance deadlines, and similar regulatory frameworks across APAC, the Middle East, and Africa are forcing organisations to confront an uncomfortable reality: most AI infrastructure today is fundamentally not sovereign.\n\nWhen your AI agents process sensitive data through a hyperscaler's proprietary platform, governed by another nation's laws (hello, US CLOUD Act), you don't truly control your AI. You're renting it."},{"id":4187,"day":"2026-10-29","start":"12:30","end":"12:55","room":"Room 103","title":"Moving Beyond the Spec: Humanising APIs","type":"talk","event":["Apidays"],"track":["Semantic Layer"],"speakers":[{"n":"Eeshaan Sawant","c":"Independant","j":""}],"desc":"We talk a lot about API specs, but not nearly enough about API experience. Sure, OpenAPI is great at defining how APIs work—but does it tell us how to make them feel more human?\n\nIn this talk, we’ll go beyond the spec and straight into the developer experience. I’ll show you how to create API references and docs that feel clear, inclusive, and welcoming from the very first read. We’ll see how to \"\"bake\"\" empathy into your workflow, and why localisation isn’t just a “nice to have”.\n\nIf you care about building APIs people actually want to use, this talk is for you."},{"id":4224,"day":"2026-10-29","start":"12:30","end":"12:55","room":"Room 105","title":"Agents Are the New API Consumers: Making Enterprise APIs Agent-Ready","type":"talk","event":["Apidays"],"track":["API & AI in Banking and finance"],"speakers":[{"n":"Dharanidharan Balasubramaniam","c":"Westpac","j":"Engineering Manager"}],"desc":"For years, we designed APIs for predictable callers: apps, integrations and developers who read the docs. AI agents change that. They decide at runtime which APIs to call, chain requests in unexpected ways, act on behalf of users, and can generate far more traffic than any human-driven app.\nThis session shares practical lessons from connecting AI agents to real enterprise APIs using Copilot Studio, Power Platform and the Model Context Protocol (MCP). We'll look at where traditional API assumptions break down and how to fix them. That covers designing an agent-facing layer with MCP and connectors, handling identity and delegated access, enforcing rate limits and guardrails, and building audit trails so every agent action is traceable and accountable.\nUsing an end-to-end document-processing scenario, you'll see the API design decisions that made the difference between a demo and a production-ready agent.\n\nKey takeaways:\n1.Why AI agents need different API design and governance than traditional clients\n2.How to use MCP and connectors to expose existing APIs to agents safely\n3.Patterns for identity, human-in-the-loop approvals and observability of agent actions\n4.A practical checklist for making your APIs \"\"agent-ready\"\""},{"id":4199,"day":"2026-10-29","start":"12:30","end":"12:55","room":"Room 104","title":"Telling Your Success Story: Illustrating Graph Impact Through Observability","type":"talk","event":["GraphQL Day"],"track":[],"speakers":[{"n":"Tim Hingston","c":"Apollo GraphQL","j":"Senior Staff Engineer"}],"desc":"Building a graph requires real up-front investment - designing schemas, deploying new infrastructure, and onboarding teams onto unfamiliar platforms costs precious time and energy. So why bother?\n\nYou’ve heard the success stories, from startups to enterprise companies, who’ve transformed their businesses by bringing them onto the graph. But don’t believe the hype - believe the data! YOUR data.\n\nThis talk is for anyone who wants to tell their own story, backed by their own data, about how the graph is driving business impact. We’ll illustrate the key signals for growth that can help you paint a compelling picture of value delivered, starting with some of the obvious data points and delving into deeper insights.\n\nYou’ll learn how to leverage GraphQL telemetry to track adoption of a graph platform over time. Come away with new tools to spot high-performing areas, friction signals, and other opportunities for improvement that will unlock even more value from your graph."},{"id":4061,"day":"2026-10-29","start":"13:00","end":"14:00","room":"","title":"Lunch Break / Networking / Expo","type":"break","event":["Apidays","Cloud Native Summit","GraphQL Day"],"track":[],"speakers":[],"desc":""},{"id":4163,"day":"2026-10-29","start":"14:00","end":"14:25","room":"Room 104","title":"Ask, Don't Fetch: Why GraphQL + MCP Is the Native Language of AI Agents","type":"talk","event":["GraphQL Day"],"track":[],"speakers":[{"n":"Akshay N Shaju","c":"IBM","j":"Senior Engineer"}],"desc":"REST APIs were designed for human-built clients that know exactly what URL to call. AI agents are different — they reason, plan, and decide what data they need at runtime. That mismatch is quietly becoming one of the biggest friction points in enterprise AI adoption.\n\nIn this session, we explore why GraphQL, paired with the Model Context Protocol (MCP), is uniquely positioned to become the standard interface layer for agentic systems. You'll learn how GraphQL's strong typing and introspection eliminate the hallucination risk of ambiguous REST contracts, how its precise data retrieval model solves the over-fetching and under-fetching problems that make LLM tool calls expensive and unpredictable, and how MCP builds on top of this to give AI agents a standardised, self-describing surface to discover and invoke capabilities — without custom glue code per integration.\n\nWalk away with a clear mental model of the GraphQL-MCP stack, a practical pattern for evolving existing REST endpoints into agent-ready GraphQL APIs, and real examples of AI agents successfully navigating complex multi-step queries using schema-declared tools.\n\nWhether you're an API architect, a backend engineer, or a developer building your first AI agent, this session gives you the vocabulary and the blueprint to make your APIs first-class citizens in the agentic world."},{"id":4255,"day":"2026-10-29","start":"14:00","end":"14:25","room":"Room 106","title":"Securing Azure Kubernetes Service (AKS): Network Policies, Private Clusters & Pod Security","type":"talk","event":["Cloud Native Summit"],"track":[],"speakers":[{"n":"Santhoshkumar\tAnandakrishnan","c":"Skyline Technology Aus","j":""},{"n":"Thiago \tShimada Ramos","c":"EnclaveAI Studio","j":""}],"desc":"AKS security is often treated as an extension of general Azure network security. Still, Kubernetes networking has its own model, its own failure modes, and its own set of tools — and getting it wrong can undermine every other security control in the environment.\n\nThis advanced session is built for platform and security engineers who need a comprehensive understanding of securing AKS networking.\n\nWe'll start by comparing AKS networking models — kubenet, Azure CNI, and CNI Overlay — and the security and scalability trade-offs of each.\n\nFrom there, we dive into Kubernetes Network Policies, comparing Azure's native Network Policy Manager with Calico, and showing how to enforce pod-to-pod and namespace-level segmentation that mirrors the micro-segmentation principles used at the VNet layer.\n\nWe'll cover private AKS cluster architecture in depth, including how API server access works when the control plane has no public endpoint, and the DNS considerations that come with it. The session also addresses identity: comparing Workload Identity (the modern, recommended approach) against legacy pod-managed identities, and why this choice matters for both security and operational simplicity.\n\nA demo session with cluster security settings."},{"id":4081,"day":"2026-10-29","start":"14:00","end":"14:25","room":"Room 101 + 102","title":"Beyond REST: Why MCP Is the Next Evolution of APIs (Live Demo with ClickHouse + AI)","type":"talk","event":["Apidays"],"track":["AI"],"speakers":[{"n":"Patrick Zhao","c":"7-Eleven Australia","j":"Domain Architect"}],"desc":"Modern APIs have been built around request/response patterns for decades—but AI-native applications are starting to challenge this model.\n\nIn this session, we explore the emergence of the Model Context Protocol (MCP) as a new way for systems to expose capabilities—not just endpoints. Instead of calling APIs, AI agents interact with tools, data, and services through structured context.\n\nThis talk includes a live demo showcasing:\n\nA ClickHouse-powered data layer for high-performance analytics\nLibreChat as an AI interface for interacting with systems\nMCP as the protocol layer enabling dynamic tool usage\n\nWe’ll walk through how MCP differs from REST and GraphQL, where it fits in existing architectures, and what this shift means for API gateways, observability, and platform design.\n\nAttendees will gain a practical understanding of how to start experimenting with MCP today, and why it may redefine how APIs are built and consumed in the near future."},{"id":4139,"day":"2026-10-29","start":"14:00","end":"14:25","room":"Room 103","title":"Change is only good when measured: building confidence through experimentation","type":"talk","event":["Apidays"],"track":["API & AI Observability"],"speakers":[{"n":"Fadila Fidina","c":"Atlassian","j":"Senior Software Engineer"}],"desc":"Shipping a new feature is easy. Knowing if it actually improved anything? That's the hard part.\n\nMany teams ship features based on intuition rather than evidence.\n\nThis makes it impossible to understand user behaviour or build confidence in product decisions.\n\nExperimentation is the only reliable way for engineering teams to uncover the true impact of the features they ship.\n\nIn this talk, I’ll walk through the experimentation lifecycle from an engineering perspective - forming a hypothesis, adding instrumentation, gathering data, and learning from the results - showing how teams can embed this process into their feature release practices at scale."},{"id":4295,"day":"2026-10-29","start":"14:00","end":"14:25","room":"Room 105","title":"Spec-Driven Development: Where Intent Meets Implementation","type":"talk","event":["Apidays"],"track":["Digital mindset"],"speakers":[{"n":"Pavithra Navaneeth","c":"Industry Professional","j":"Principal Engineer (DevSecOps) - Tech Product Owner"}],"desc":"Your API spec has been lying to you.\n\nIt was accurate on launch day. Then the code moved on, and nobody noticed. That was an annoyance when humans read it. It’s a much bigger problem now that AI agents read it, build from it, and believe every word.\n\nWhen AI agents can generate code, tests, mocks, and integrations in minutes, the scarce skill is no longer writing code. It’s saying precisely what you mean.\n\nThis talk explores spec-driven development: what it is, how it relates to intent-driven development, and what changes when the spec becomes the source of truth and implementation follows from it.\n\nFrameworks such as BMAD, Spec Kit, OpenSpec, and Kiro are making this real, but choosing a framework is only half the challenge. You still need to decide what the spec must say and how you’ll prove it was met.\n\nWe’ll tackle that through the Spec Stack:\n\n• Intent — goals, context, constraints, and tools\n\n• Behaviour — business rules and scenarios that can’t be misread\n\n• Contract — OpenAPI, AsyncAPI, and Arazzo as executable architecture\n\n• Evidence — evals, harnesses, and feedback loops that prove implementation matches intent\n\nYou’ll leave with a practical mental model, a one-page spec template, and a first step you can put to work Monday morning."},{"id":4084,"day":"2026-10-29","start":"14:30","end":"14:55","room":"Room 101 + 102","title":"From Figma to Production: Orchestrating Multi-Agent SDLCs","type":"talk","event":["Apidays"],"track":["AI"],"speakers":[{"n":"Niharika Kargudri","c":"Mantel Group","j":"Lead Software Engineer"}],"desc":"We’ve all been there: you get a Figma link, pass it to an AI tool, and hope for perfect code. Instead, you get broken edge cases, design mismatches, and a mountain of PR comments. The real headache starts when \"v2\" designs drop, and you’re stuck manually updating Jira tickets, documentation, and code just to keep everyone on the same page.\nThis session explains how we fixed this by moving away from simple prompts and building a connected step-by-step system. By creating specialized, automated tasks for each stage of development, we reduced the manual work per feature from 8 hours to just 24 minutes. This system is already running successfully in production and has been adopted by multiple teams.\n\nThis will cover:\nAutomating the Setup: How we use AI to instantly write technical specs for product managers and documentation for designers.\nIn-Repo Automation: Running automated tasks directly inside the codebase to set up components and write tests for developers and QA.\nHandling Design Updates: How the system automatically updates a shared team index in Confluence whenever a design changes, keeping everyone in sync.\nHuman Checkpoints: Why we built mandatory human reviews into the process to catch logic gaps before any code is generated."},{"id":4083,"day":"2026-10-29","start":"14:30","end":"14:55","room":"Room 103","title":"AI-assisted quality across the SDLC","type":"talk","event":["Apidays"],"track":["AI"],"speakers":[{"n":"Haritha Hari","c":"Autograb","j":"Senior Quality Coach"}],"desc":"AI-assisted development has changed the pace at which software gets built. Features that once took weeks are completed in days. Pull requests arrive faster, release cycles compress, and the volume of work reaching quality engineers has grown faster than teams can absorb it. The bottleneck has shifted — development velocity is no longer the constraint, but quality coverage is."},{"id":4256,"day":"2026-10-29","start":"14:30","end":"14:55","room":"Room 106","title":"The Build Passed and the Model Failed","type":"talk","event":["Cloud Native Summit"],"track":[],"speakers":[{"n":"Renaldi Gondosubroto","c":"Cloudetica Solutions","j":"Director"}],"desc":"A platform team had reached the point where changes to its AI application looked reassuringly similar to changes anywhere else in the software estate. Prompts lived in Git, model configuration was versioned, pull requests required review, automated tests ran on every change, and deployments moved through the normal delivery pipeline. One release passed every check and deployed without an infrastructure error. The application was still worse than the version it replaced. Nothing had crashed. Latency remained within its target and the APIs were healthy. The regression was behavioural. A relatively small change to the system prompt had improved performance on one class of requests while making another less reliable. The existing pipeline had been built to detect software failures, so from its perspective the release was completely healthy. This session follows the engineering response to that incident and the architecture that emerged from it. Instead of placing AI evaluation outside the delivery process as a periodic benchmarking exercise, the team made model behaviour part of the release contract. Prompt changes, model upgrades, retrieval configuration and tool definitions became versioned application dependencies with their own validation requirements. We will walk through the resulting delivery architecture, including representative evaluation datasets, deterministic checks around tool use and structured outputs, model-scored evaluation where deterministic assertions are insufficient, and regression thresholds that can prevent a change from progressing. The case study also covers how those evaluations were kept useful as the application changed, rather than allowing the test set to become a static collection that the system gradually learned to satisfy. The production side required a different set of controls. Offline evaluation reduced the number of bad releases, but it could not reproduce every real request. The deployment process therefore introduced shadow evaluation, limited canary releases and production feedback signals so that behavioural regressions could be detected without making every model change an all-or-nothing deployment. A significant part of the session focuses on the engineering problems that appear once this becomes CI/CD. Model outputs are not always deterministic, evaluation adds cost and latency to pipelines, and an aggregate score can hide a serious regression affecting a small but important class of requests. The architecture has to account for those properties instead of pretending an LLM test suite behaves like ordinary unit tests. The case study ultimately changed the team's definition of a successful deployment. Healthy infrastructure was no longer enough. An AI release also had to demonstrate that the behaviour users depended on had not materially regressed. Attendees will leave with a practical architecture for bringing prompts, models and behavioural evaluation into a cloud-native delivery pipeline without turning every pull request into a manual AI review."},{"id":4251,"day":"2026-10-29","start":"14:30","end":"14:55","room":"Room 104","title":"From Flinders St. to Federation: A GraphQL Deep Dive","type":"talk","event":["GraphQL Day"],"track":[],"speakers":[{"n":"Eeshaan Sawant","c":"Independant","j":""}],"desc":"G'day Melbourne! Come join us on this tram — it is an all-stops service, a 50-minute ride that starts at the very first stop and doesn't get off until Federation, skipping nothing in between. No prior GraphQL knowledge needed to climb aboard!\n\nAs GraphQL continues to mature as an API for Humans and Agents, we regularly come across developers who have seldom heard of GraphQL, and far fewer know how it actually works, or the problem it solves.\n\nThe tram will set off with the basics — Whats and Whys of GraphQL, and ride stops that make up every GraphQL API: the schemas and the queries, how mutations work, the versatility of resolvers, subscriptions for real-time updates, the infamous N+1 problem, schema-stitching and finally Federation, taking you through the whole GraphQL tram route, end-to-end.\n\nTap your Mykis and sit tight: you'll step off with a clear mental model of how GraphQL fits together, why it's the API to watch in the AI era, and a map to explore the rest on your own."},{"id":4082,"day":"2026-10-29","start":"14:30","end":"14:55","room":"Room 105","title":"From Microservices to Multi-Agent Systems","type":"talk","event":["Apidays"],"track":["Semantic Layer"],"speakers":[{"n":"Jeff\tIshar","c":"Auth0","j":"Solutions Architect"}],"desc":"AI agents are a new kind of API consumer, calling the same services you already run but behaving very differently. This talk compares how rate limiting, security, observability and reliability change when the caller is an agent, and what to do about it, using the API platform you already have. It is vendor-neutral and suits technical and non-technical audiences."},{"id":4085,"day":"2026-10-29","start":"15:00","end":"15:25","room":"Room 103","title":"Future of SREs with A(P)I","type":"talk","event":["Apidays"],"track":["API & AI Observability"],"speakers":[{"n":"Jay\tDesai","c":"Datadog","j":"Senior Solutions Engineer"}],"desc":"Modern SRE isn’t just about reacting to alerts — it’s about designing systems that are observable, programmable, and increasingly autonomous.\n\nIn this talk, we’ll explore the full Incident Management lifecycle, examine where humans struggle under scale, and discuss how AI and APIs together unlock a new model of reliability engineering.\n\nThe future of SRE isn’t just AI-powered — it’s API-driven.\nWhen observability, automation, and AI combine, reliability becomes programmable."},{"id":4086,"day":"2026-10-29","start":"15:00","end":"15:25","room":"Room 101 + 102","title":"How to Build Agentic AI That Actually Works","type":"talk","event":["Apidays"],"track":["AI"],"speakers":[{"n":"Nilesh Gule","c":"Avanade","j":"Senior Cloud Solutions Architect"}],"desc":""},{"id":4257,"day":"2026-10-29","start":"15:00","end":"15:25","room":"Room 106","title":"Agentic Platform Engineering on Kubernetes — From Design to Operations with AI in the Loop","type":"talk","event":["Cloud Native Summit"],"track":[],"speakers":[{"n":"Frank Fan","c":"Amazon Web Services","j":"Solution Architect"}],"desc":"Platform engineering teams are stretched thin — the Kubernetes ecosystem spans GitOps, security, observability, cost, and networking, yet most platforms are maintained by a small team that becomes the bottleneck for every decision. APEX (Agentic Platform Engineering eXperience) applies AI agents across the full lifecycle: designing architectures, generating guardrail-validated Terraform, and diagnosing live operational issues — all steered by expert-authored SKILL.md files that encode best practices rather than generic output.\n\nIn this session, we'll demonstrate how a progressive permission model expands from read-only to autonomous operation as trust builds. Attendees will leave with a practical framework for introducing agentic workflows without sacrificing human oversight or operational discipline."},{"id":4188,"day":"2026-10-29","start":"15:00","end":"15:25","room":"Room 105","title":"Beyond REST: Evolving Arazzo for Real-World Agentic Workflows","type":"talk","event":["Apidays"],"track":["Semantic Layer"],"speakers":[{"n":"Naresh Jain","c":"Specmatic","j":"Founder & CEO"}],"desc":"A real-world business workflow rarely stays within the boundaries of a single API style.\n\nAn order might begin with an HTTP API described using OpenAPI, trigger an event described using AsyncAPI, invoke a Protobuf RPC service, query data through GraphQL, and eventually receive an asynchronous notification. Agentic applications make this even more important: an agent needs to understand not just individual API operations, but how capabilities across heterogeneous systems can be composed into a meaningful workflow.\n\nArazzo was created to describe sequences of API calls and the dependencies between them. But what happens when the next step isn’t another OpenAPI operation?\n\nIn this talk, we’ll look at how Arazzo is evolving to support heterogeneous API interaction models. Drawing on the work to introduce AsyncAPI, Protocol Buffer RPC and GraphQL support into the Arazzo Specification, we’ll explore some of the surprisingly difficult design questions that emerge when REST-style request/response assumptions disappear.\n\nHow do you represent send and receive operations in an event-driven system? What does a workflow step mean when an RPC is server-streaming or bidirectional? How should GraphQL queries, mutations and subscriptions participate in a workflow? And how can we add these capabilities without turning Arazzo into a collection of protocol-specific special cases?\n\nWe’ll use these questions to explore a broader idea: Arazzo can become a protocol-independent description of how API capabilities are composed to accomplish an outcome.\n\nThat has implications beyond API documentation and testing. For AI agents, an Arazzo workflow can provide something increasingly valuable: an explicit, machine-readable description of which capabilities to invoke, in what sequence, how data flows between them, and what successful execution looks like.\n\nRather than asking agents to infer workflows from a collection of disconnected API descriptions, we can start making the workflow itself part of the contract."},{"id":4087,"day":"2026-10-29","start":"15:30","end":"15:55","room":"Room 101 + 102","title":"From REST APIs to AI Agents: Lessons from 15 Years of Building Enterprise API Platforms","type":"talk","event":["Apidays"],"track":["AI"],"speakers":[{"n":"Prasanna Dangalla","c":"Xeople","j":"Senior Software Engineer — API / WSO2 Platform Lead"}],"desc":"Over the last fifteen years, enterprise APIs have undergone multiple waves of transformation from SOAP services and REST APIs to cloud native architectures, microservices, GraphQL, event driven systems, and now AI agents. Each generation has introduced new technologies, architectural patterns, and ways of thinking. Yet despite all this change, the core engineering principles behind successful API platforms have remained remarkably consistent.\n\nThis session explores the evolution of our industry through the lens of someone who has spent the last 15 years building enterprise API platforms.\n\nDrawing on real-world experience building API gateways, designing enterprise integrations, supporting global production systems including nearly a decade contributing to the WSO2 API Manager core engineering team and more recently developing healthcare integration platforms, this talk connects the lessons of the past with the challenges of the AI era.\n\nRather than treating AI as a replacement for existing architectures, we'll explore how AI agents represent a new generation of API consumers—and what that means for API design, security, governance, observability, developer experience, and platform engineering.\n\nAttendees will leave with practical lessons from multiple generations of API evolution, a deeper understanding of why the fundamental principles of enterprise API engineering remain timeless, and a practical roadmap for preparing existing API platforms for an AI-driven future.\n\nLearning Outcomes\nAttendees will learn:\n\nHow enterprise APIs have evolved over the last 15 years.\n\nWhich engineering principles have remained constant despite changing technologies.\n\nWhy AI agents represent a new class of API consumer rather than a replacement for APIs.\n\nHow API platforms should evolve to support AI driven applications.\n\nPractical lessons from designing, building, and operating enterprise API platforms at scale.\n\nWhy This Talk?\nWhile many sessions explore the possibilities of AI, this presentation focuses on the engineering journey that has led us here.\n\nRather than concentrating on AI hype or theoretical concepts, it connects fifteen years of enterprise API engineering with the next generation of API consumers.\n\nAttendees will hear practical stories from real production environments, learn architectural lessons that remain relevant regardless of technology trends, and understand how existing enterprise API platforms can evolve to support AI rather than be replaced by it."},{"id":4377,"day":"2026-10-29","start":"15:30","end":"15:55","room":"Room 103","title":"The Architecture of Influence: The Human Skills Nobody Teaches Architects","type":"talk","event":["Apidays"],"track":["Architecture for Strategy"],"speakers":[{"n":"Kimche Limpahan","c":"SkyCity Adelaide","j":"Enterprise Solutions Architect"}],"desc":"We teach architects how to design systems, technologies and solutions—but rarely how to navigate the human dynamics that determine whether those solutions actually succeed.\n\nAfter around ten years working across solution and enterprise architecture, I have learned that some of the hardest architecture problems are not technical. They involve influence, trust, communication, competing perspectives, resistance to change and establishing credibility in complex environments.\n\nAs a woman in technology who is often perceived as younger than I am, I have also experienced the challenge of establishing credibility before having the opportunity to demonstrate expertise. These experiences have fundamentally shaped how I approach architecture and leadership.\n\nThis talk explores the human side of architecture: how emotional intelligence, authenticity, situational awareness and communication can become practical tools for architects.\n\nThrough real-world experiences and lessons from transformation environments, I will explore how architects can read a room, challenge ideas without creating resistance, communicate across technical and business audiences, build trust, and influence decisions without relying solely on positional authority.\n\nBecause ultimately, architecture is not just about designing technology.\n\nIt is about helping people make complex decisions and move toward change together."},{"id":4189,"day":"2026-10-29","start":"15:30","end":"15:55","room":"Room 105","title":"Durable Execution: An Awakening","type":"talk","event":["Apidays"],"track":["Semantic Layer"],"speakers":[{"n":"Gaurav Thadani","c":"Temporal Technologies","j":"Senior Developer Success Engineer"}],"desc":"We build software to deliver reliable business operations. Yet in doing so, we often over-engineer the same repeatable, complex, and mundane patterns, paying a hidden \"\"complexity tax\"\" that grows with every system we scale. As Desmond Tutu said: \"\"There is only one way to eat an elephant: one bite at a time.\"\" But which bites matter?\n\nDistributed systems force us to repeatedly solve fundamental challenges: retries that don't survive process restarts, microservices and serverless fragmentation, tracking business state across services, the local development nightmare, and evolving live applications under accumulated complexity. Is it worth reinventing these patterns before building actual business value? What if these concerns could be managed for you?\n\nDurable Execution — the Temporal Workflow (OSS, MIT Licensed) — is that awakening. Not a new shiny tool, but a 20-year refinement of a powerful idea. In this session, we'll explore how Temporal addresses these challenges and helps you stop paying the complexity tax."},{"id":4254,"day":"2026-10-29","start":"15:30","end":"15:55","room":"Room 106","title":"Why can't I have more tokens Rob? Using agentgateway to keep your AI usage under control.","type":"talk","event":["Cloud Native Summit"],"track":[],"speakers":[{"n":"Akshay Adsul","c":"Solo.io","j":"APAC Lead CS Engineering"},{"n":"Kasun \tTalwatta","c":"Solo.io","j":"Principal Solutions Architect"}],"desc":"Industry trends are pushing companies to use more AI, often \"\"at all costs\"\". However, once CFOs start seeing the bills, the reality of \"\"at all costs\"\" really starts to sink in, and we start to turn to more pragmatic approaches to AI budgets.\n\nThe first step to managing AI spend is to have good monitoring in place. You need to know who your big users are, and which projects or workflows are draining your token budget. The answers can often be surprising!\n\nIn this talk, I'll walk through a live demo of how you can set up monitoring across multiple providers, with centralized access, using agentgateway. We'll talk about what metrics are important to track, and some gateway patterns we can use to keep costs from becoming unmanageable, like token-based rate-limiting.\n\nThe full step-by-step demo will be available on Github and the audience can optionally follow along on their own machines."},{"id":4062,"day":"2026-10-29","start":"16:00","end":"16:20","room":"","title":"Coffee Break / Networking / Expo","type":"break","event":["Apidays","Cloud Native Summit"],"track":[],"speakers":[],"desc":""},{"id":4286,"day":"2026-10-29","start":"16:20","end":"16:45","room":"Room 106","title":"TBA","type":"talk","event":["Cloud Native Summit"],"track":[],"speakers":[],"desc":""},{"id":4227,"day":"2026-10-29","start":"16:20","end":"16:45","room":"Room 101 + 102","title":"Agents don't take no: gateway controls for non-human traffic","type":"talk","event":["Apidays"],"track":["AI"],"speakers":[{"n":"Rajeev Ramani","c":"ItFromBit","j":"Founder & Principal Consultant"}],"desc":"Most APIs and portals were built assuming a person, or a well-behaved integration, is on the other end. Autonomous agents break that assumption. Tell an agent \"\"no\"\" and it doesn't give up; it looks for another door, and often finds one where the UI is protected but the data paths behind it are not. ASD's recent guidance is blunt: the model can't reliably protect itself, so the controls have to sit around it.\n\nDrawing on 20 years of building and running API gateways (Apigee, Kong, Envoy), I'll argue that the gateway is where most of those controls already belong, and that it has to work in both directions. Inbound: authentication on every data path, not just the UI; identifying agent traffic; behavioural rate limits; retiring legacy endpoints; and audit logs you can actually query. Outbound: an AI/MCP gateway with tool allowlists, budgets and human approval for your own agents.\n\nThis isn't a product talk. Attendees leave with a seven-point checklist they can run against their own platform next week, plus the blind spots a gateway won't cover."},{"id":4226,"day":"2026-10-29","start":"16:20","end":"16:45","room":"Room 103","title":"How can we analyse thousands of comments to derive reliable insights? Lessons from analysing student feedback at scale.","type":"talk","event":["Apidays"],"track":["API & AI Observability"],"speakers":[{"n":"Anastasiia Mironova","c":"Monash University","j":"Senior Performance Analyst"},{"n":"Afzal Khan","c":"Monash University","j":"Senior Performance Analyst"}],"desc":"Universities collect large volumes of student feedback, but much of its value is locked inside free-text comments. Generative AI creates an opportunity to analyse this feedback at scale. However, the quality of the results depends on the approach used, and determining whether those results can be trusted is an additional challenge.\nThis talk presents a real-world approach developed by professional staff at Monash University to prepare and analyse student comments from the Student Evaluation of Teaching and Units (SETU).\nWe will look at how generative AI can be used to decompose complex comments containing multiple ideas into individual feedback points, classify those points, and aggregate them to identify patterns in student feedback. We will also examine how the reliability of the output can be evaluated.\nUsing our experience with student feedback as a case study, we will discuss the practical challenges we encountered, the approaches we used to assess the results, and what we learned about turning unstructured human feedback into structured information that can support analysis."},{"id":4296,"day":"2026-10-29","start":"16:20","end":"16:50","room":"Room 105","title":"How to build an intelligent, automated, and governed business","type":"talk","event":["Apidays"],"track":["Semantic Layer"],"speakers":[{"n":"Nakul Deshmukh","c":"xysec","j":"Founder"},{"n":"Jamie Le","c":"DreamIT","j":"CEO"}],"desc":"We have intelligence on tap. An amalgamation of everyone's thoughts at our fingertips, and making decisions on our behalf.\nWhile AI keeps improving, its capabilities are astounding, and dangerous. The skill needed to harness this is proportional to the job that needs doing - so how do you keep pace with AI, how can you use AI in business in regulated spaces, and what are the opportunities in Australia right now to enable sovereign capabilities for businesses under obligations."},{"id":4287,"day":"2026-10-29","start":"16:50","end":"16:50","room":"","title":"End of Day 2","type":"break","event":["Apidays","Cloud Native Summit"],"track":[],"speakers":[],"desc":""}]</script>
<script>
(function () {
  const SESSIONS = JSON.parse(document.getElementById('data').textContent);
  const SLOT = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--slot')) || 20;
  const DAYS = { '2026-10-28': 'Wed 28 Oct', '2026-10-29': 'Thu 29 Oct' };
  const EV = {
    'Apidays': 'a', 'Cloud Native Summit': 'c', 'API Economy Summit': 'e',
    'The Executive AI Security Forum': 's', 'GraphQL Day': 'g'
  };
  const EV_SHORT = {
    'Apidays': 'Apidays', 'Cloud Native Summit': 'Cloud Native Summit', 'API Economy Summit': 'API Economy Summit',
    'The Executive AI Security Forum': 'Exec AI Security Forum', 'GraphQL Day': 'GraphQL Day'
  };
  const BADGE = { keynote: 'Keynote', workshop: 'Workshop', facilitated_roundtable: 'Roundtable', opening_remarks: 'Opening' };
  const HIDE_TRACK = new Set(['keynote', 'The Executive AI Security Forum']);
  const MAIN_STAGE = 'Room 109 + 110';
  const STORE = 'apidays-au-2026-picks';

  const toMin = (hm) => { const [h, m] = hm.split(':').map(Number); return h * 60 + m; };
  const fmt = (m) => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
  SESSIONS.forEach((s) => {
    s._s = toMin(s.start); s._e = toMin(s.end);
    s._ev = EV[s.event[0]] || 'a';
    s._track = s.track.filter((t) => !HIDE_TRACK.has(t));
    s._hay = [s.title, s.room, s.event.join(' '), s.track.join(' '),
      s.speakers.map((p) => p.n + ' ' + p.c).join(' ')].join(' ').toLowerCase();
  });

  // ---- picks (per device) ----
  let picks = new Set();
  try { picks = new Set(JSON.parse(localStorage.getItem(STORE) || '[]')); } catch (e) { /* storage unavailable */ }
  const savePicks = () => { try { localStorage.setItem(STORE, JSON.stringify([...picks])); } catch (e) { /* ignore */ } };

  // ---- Melbourne clock ----
  function melbourneNow() {
    const parts = new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Australia/Melbourne', year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
    }).formatToParts(new Date());
    const g = (t) => parts.find((p) => p.type === t).value;
    return { date: g('year') + '-' + g('month') + '-' + g('day'), min: Number(g('hour')) * 60 + Number(g('minute')) };
  }

  const grid = document.getElementById('grid');
  const scroller = document.getElementById('scroller');
  const q = document.getElementById('q');
  const pickBtn = document.getElementById('picks');
  let day = melbourneNow().date === '2026-10-29' ? '2026-10-29' : '2026-10-28';
  let onlyPicks = false;
  let range = null;
  let nowEl = null;

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function place(n, row, span, col, colEnd) {
    n.style.gridRow = row + ' / span ' + span;
    n.style.gridColumn = colEnd ? col + ' / ' + colEnd : String(col);
    return n;
  }
  function roomOrder(a, b) {
    if (a === MAIN_STAGE) return -1;
    if (b === MAIN_STAGE) return 1;
    return parseInt(a.replace(/\D+/, ''), 10) - parseInt(b.replace(/\D+/, ''), 10);
  }
  function assignLanes(list) {
    let cluster = [], laneEnds = [], clusterEnd = -1;
    const flush = () => { cluster.forEach((s) => { s._lanes = laneEnds.length; }); cluster = []; laneEnds = []; clusterEnd = -1; };
    list.forEach((s) => {
      if (cluster.length && s._s >= clusterEnd) flush();
      let i = laneEnds.findIndex((e) => e <= s._s);
      if (i < 0) { i = laneEnds.length; laneEnds.push(s._e); } else { laneEnds[i] = s._e; }
      s._lane = i; cluster.push(s); clusterEnd = Math.max(clusterEnd, s._e);
    });
    if (cluster.length) flush();
  }
  function speakerLine(s) {
    return s.speakers.map((p) => p.c ? p.n + ' · ' + p.c : p.n).join('; ');
  }

  function render() {
    const slot = SLOT();
    const list = SESSIONS.filter((s) => s.day === day);
    const breaks = list.filter((s) => !s.room);
    const talks = list.filter((s) => s.room);
    const rooms = [...new Set(talks.map((s) => s.room))].sort(roomOrder);
    const start = Math.floor(Math.min(...list.map((s) => s._s)) / 15) * 15;
    const end = Math.ceil((Math.max(...list.map((s) => s._e)) + 5) / 5) * 5;
    const rows = (end - start) / 5;
    range = { start, end };
    const rowOf = (m) => (m - start) / 5 + 2;

    // Rooms with two talks in the same slot get a wider column so both stay readable.
    const weight = {};
    rooms.forEach((r) => {
      const inRoom = talks.filter((s) => s.room === r).sort((a, b) => a._s - b._s || a.id - b.id);
      assignLanes(inRoom);
      const lanes = Math.max(...inRoom.map((s) => s._lanes));
      weight[r] = r === MAIN_STAGE ? 0.85 : lanes > 1 ? 1.4 : 1;
    });
    grid.textContent = '';
    grid.style.gridTemplateColumns = 'var(--tc) ' + rooms.map((r) =>
      'minmax(calc(var(--colmin) * ' + weight[r] + '), ' + weight[r] + 'fr)').join(' ');
    grid.style.gridTemplateRows = 'auto repeat(' + rows + ', var(--slot))';
    grid.style.minWidth = 'calc(var(--tc) + ' + rooms.reduce((a, r) => a + weight[r], 0).toFixed(2) + ' * var(--colmin))';

    // header row
    grid.appendChild(place(el('div', 'corner', 'AEDT'), 1, 1, 1));
    rooms.forEach((r, i) => {
      const h = place(el('div', 'rh'), 1, 1, i + 2);
      h.appendChild(el('b', null, r));
      const evs = [...new Set(talks.filter((s) => s.room === r).map((s) => s.event[0]))];
      if (r === MAIN_STAGE) {
        const c = el('span', 'chip', 'Opening & keynotes'); c.dataset.ev = 'a'; h.appendChild(c);
      } else {
        evs.forEach((e) => { const c = el('span', 'chip', EV_SHORT[e] || e); c.dataset.ev = EV[e] || 'a'; h.appendChild(c); });
      }
      grid.appendChild(h);
      grid.appendChild(place(el('div', 'vc'), 2, rows, i + 2));
    });

    // time rail and guide lines
    for (let t = start; t < end; t += 15) {
      const span = Math.min(3, (end - t) / 5);
      const kind = t % 60 === 0 ? 'h' : t % 30 === 0 ? 'half' : 'q';
      grid.appendChild(place(el('div', 'tm ' + kind, fmt(t)), rowOf(t), span, 1));
      const hl = place(el('div', 'hl ' + kind), rowOf(t), 1, 2, -1);
      grid.appendChild(hl);
    }

    // breaks
    breaks.forEach((b) => {
      const zero = b._e <= b._s;
      const n = place(el('div', 'band' + (zero ? ' end' : '')), rowOf(b._s), zero ? 1 : (b._e - b._s) / 5, 2, -1);
      const label = el('span', null, b.title.replace(/\s*\/\s*/g, ' · '));
      label.appendChild(el('i', null, zero ? b.start : b.start + '–' + b.end));
      n.appendChild(label);
      grid.appendChild(n);
    });

    // sessions
    rooms.forEach((r, ci) => {
      const inRoom = talks.filter((s) => s.room === r).sort((a, b) => a._s - b._s || a.id - b.id);
      inRoom.forEach((s) => grid.appendChild(sessionEl(s, rowOf(s._s), Math.max(1, (s._e - s._s) / 5), ci + 2, slot)));
    });

    nowEl = el('div', 'now');
    nowEl.appendChild(el('span'));
    nowEl.hidden = true;
    grid.appendChild(nowEl);
    updateNow();
    applyFilter();
  }

  function sessionEl(s, row, span, col, slot) {
    const n = place(el('div', 's'), row, span, col);
    n.dataset.ev = s._ev;
    n.dataset.id = s.id;
    n.tabIndex = 0;
    n.setAttribute('role', 'button');
    n.setAttribute('aria-label', s.start + ' to ' + s.end + ', ' + s.room + ': ' + s.title + (s.speakers.length ? ', ' + speakerLine(s) : ''));
    n.style.setProperty('--lane', s._lane || 0);
    n.style.setProperty('--lanes', s._lanes || 1);
    const tba = /^tba$/i.test(s.title.trim());

    const h = span * slot - 16;
    if (h < 34) {
      n.classList.add('mini');
      const t = el('div', 'ttl');
      t.appendChild(el('b', null, s.start));
      t.appendChild(document.createTextNode(s.title));
      n.appendChild(t);
    } else {
      const meta = el('div', 'meta');
      meta.appendChild(el('span', null, s.start + '–' + s.end));
      if (BADGE[s.type]) meta.appendChild(el('span', 'badge', BADGE[s.type]));
      n.appendChild(meta);
      let avail = h - 15;
      const showSpk = s.speakers.length > 0 && avail >= 31;
      if (showSpk) avail -= 15;
      const track = s._track[0];
      const showTrk = !!track && avail >= 46;
      if (showTrk) avail -= 14;
      const lines = Math.max(1, Math.min(6, Math.floor(avail / 16)));
      const t = el('div', 'ttl' + (tba ? ' tba' : ''), tba ? 'To be announced' : s.title);
      t.style.webkitLineClamp = String(lines);
      t.style.lineClamp = String(lines);
      n.appendChild(t);
      if (showSpk) n.appendChild(el('div', 'spk', speakerLine(s)));
      if (showTrk) n.appendChild(el('div', 'trk', track));
      const star = el('button', 'star');
      star.type = 'button';
      n.appendChild(star);
    }
    paintPick(n, s.id);
    return n;
  }

  function paintPick(n, id) {
    const on = picks.has(id);
    n.classList.toggle('picked', on);
    const star = n.querySelector('.star');
    if (star) {
      star.textContent = on ? '★' : '☆';
      star.setAttribute('aria-label', on ? 'Remove from my picks' : 'Save to my picks');
      star.setAttribute('aria-pressed', on ? 'true' : 'false');
    }
  }
  function togglePick(id) {
    if (picks.has(id)) picks.delete(id); else picks.add(id);
    savePicks();
    grid.querySelectorAll('.s[data-id="' + id + '"]').forEach((n) => paintPick(n, id));
    updatePickCount();
    applyFilter();
  }
  function updatePickCount() {
    document.getElementById('pickcount').textContent = String(SESSIONS.filter((s) => picks.has(s.id) && s.day === day).length);
  }

  function applyFilter() {
    const term = q.value.trim().toLowerCase();
    grid.querySelectorAll('.s').forEach((n) => {
      const s = byId.get(Number(n.dataset.id));
      const hit = (!term || s._hay.includes(term)) && (!onlyPicks || picks.has(s.id));
      n.classList.toggle('dim', !hit);
    });
  }

  function updateNow() {
    if (!nowEl || !range) return;
    const now = melbourneNow();
    const show = now.date === day && now.min >= range.start && now.min <= range.end;
    nowEl.hidden = !show;
    if (!show) return;
    const offset = now.min - range.start;
    nowEl.style.gridRow = String(Math.floor(offset / 5) + 2);
    nowEl.style.transform = 'translateY(' + ((offset % 5) / 5) * SLOT() + 'px)';
    nowEl.firstChild.textContent = fmt(now.min);
  }

  // ---- dialog ----
  const byId = new Map(SESSIONS.map((s) => [s.id, s]));
  const dlg = document.getElementById('dlg');
  const dStar = document.getElementById('d-star');
  let openId = null;
  function paintDialogStar() {
    dStar.textContent = picks.has(openId) ? '★ Saved to my picks' : '☆ Save to my picks';
    dStar.classList.toggle('primary', !picks.has(openId));
  }
  function openSession(id) {
    const s = byId.get(id);
    openId = id;
    document.getElementById('d-meta').textContent = DAYS[s.day] + ' · ' + s.start + '–' + s.end + ' · ' + s.room;
    document.getElementById('d-title').textContent = s.title;
    const chips = document.getElementById('d-chips');
    chips.textContent = '';
    const ec = el('span', 'chip', EV_SHORT[s.event[0]] || s.event[0]); ec.dataset.ev = s._ev; chips.appendChild(ec);
    if (BADGE[s.type]) chips.appendChild(el('span', 'chip plain', BADGE[s.type]));
    s._track.forEach((t) => chips.appendChild(el('span', 'chip plain', t)));
    const spk = document.getElementById('d-spk');
    spk.textContent = '';
    s.speakers.forEach((p) => {
      const li = el('li');
      li.appendChild(el('b', null, p.n));
      const role = [p.j, p.c].filter(Boolean).join(', ');
      if (role) li.appendChild(el('span', null, role));
      spk.appendChild(li);
    });
    spk.hidden = !s.speakers.length;
    const desc = document.getElementById('d-desc');
    desc.textContent = '';
    desc.classList.toggle('empty', !s.desc);
    if (s.desc) s.desc.split(/\n\n+/).forEach((para) => desc.appendChild(el('p', null, para)));
    else desc.appendChild(el('p', null, 'No description on the official agenda.'));
    paintDialogStar();
    if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
    dlg.scrollTop = 0;
  }
  function closeDialog() { if (typeof dlg.close === 'function') dlg.close(); else dlg.removeAttribute('open'); }
  dStar.addEventListener('click', () => { togglePick(openId); paintDialogStar(); });
  document.getElementById('d-close').addEventListener('click', closeDialog);
  dlg.addEventListener('click', (e) => { if (e.target === dlg) closeDialog(); });

  // ---- events ----
  grid.addEventListener('click', (e) => {
    const star = e.target.closest('.star');
    const card = e.target.closest('.s');
    if (!card) return;
    const id = Number(card.dataset.id);
    if (star) { e.stopPropagation(); togglePick(id); return; }
    openSession(id);
  });
  grid.addEventListener('keydown', (e) => {
    if (e.target.classList && e.target.classList.contains('s') && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault();
      openSession(Number(e.target.dataset.id));
    }
  });
  document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => {
    if (b.dataset.day === day) return;
    day = b.dataset.day;
    document.querySelectorAll('.tabs button').forEach((x) => x.setAttribute('aria-selected', x === b ? 'true' : 'false'));
    render();
    updatePickCount();
    scroller.scrollTo({ top: 0, left: 0 });
    scrollToNow();
  }));
  q.addEventListener('input', applyFilter);
  pickBtn.addEventListener('click', () => {
    onlyPicks = !onlyPicks;
    pickBtn.setAttribute('aria-pressed', onlyPicks ? 'true' : 'false');
    applyFilter();
  });

  function scrollToNow() {
    if (nowEl && !nowEl.hidden) {
      const top = nowEl.offsetTop - 90;
      scroller.scrollTop = Math.max(0, top);
    }
  }

  document.querySelectorAll('.tabs button').forEach((x) => x.setAttribute('aria-selected', x.dataset.day === day ? 'true' : 'false'));
  render();
  updatePickCount();
  scrollToNow();
  setInterval(updateNow, 60000);
})();
</script>
</body>
</html>
